<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Hub & Brainrot Lineup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: #1e293b;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            margin-top: 20px;
        }

        .screen {
            display: none;
            animation: fadeIn 0.3s ease-in;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1, h2, h3 {
            color: #38bdf8;
            margin-bottom: 16px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #38bdf8;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background-color: #0ea5e9;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 12px;
        }

        button:hover {
            background-color: #0284c7;
        }

        .btn-secondary {
            background-color: #475569;
        }

        .btn-secondary:hover {
            background-color: #334155;
        }

        /* Database/List Styles */
        .controls-row {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .card {
            background-color: #334155;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            border-left: 5px solid #38bdf8;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #475569;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .grid-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 0.9rem;
        }

        .stat-label {
            color: #94a3b8;
        }

        .stat-value {
            color: #34d399;
            font-weight: bold;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        
        .error-msg {
            color: #ef4444;
            font-size: 0.9rem;
            margin-bottom: 12px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- SCREEN 1: LOGIN -->
        <div id="loginScreen" class="screen active">
            <h1>Game Hub Login</h1>
            <p style="text-align: center; color: #94a3b8; margin-bottom: 20px;">Save your local progress securely</p>
            
            <div id="loginError" class="error-msg">Please fill all fields.</div>

            <div class="input-group">
                <label>Name:</label>
                <input type="text" id="authName" placeholder="Enter your name">
            </div>
            <div class="input-group">
                <label>Gmail:</label>
                <input type="email" id="authEmail" placeholder="Enter your gmail">
            </div>
            <div class="input-group">
                <label>Password:</label>
                <input type="password" id="authPassword" placeholder="Enter your password">
            </div>

            <button onclick="handleLogin()">Sign In / Log In</button>
        </div>

        <!-- SCREEN 2: GAME SELECTION -->
        <div id="selectionScreen" class="screen">
            <div class="nav-bar">
                <span id="welcomeText" style="font-weight: bold; color: #38bdf8;"></span>
                <button class="btn-secondary" style="width: auto; padding: 6px 12px; margin: 0;" onclick="logout()">Logout</button>
            </div>
            
            <h2>Select a Game</h2>
            
            <button onclick="openGame('brainrots')">🚆 Don't Crash Train For Brainrots</button>
            <button class="btn-secondary" onclick="openGame('crystal')">💎 Crystal Collecting Simulator (Coming Soon)</button>
        </div>

        <!-- SCREEN 3: DON'T CRASH DATABASE -->
        <div id="brainrotsScreen" class="screen">
            <div class="nav-bar">
                <h3>Brainrots Lineup Data</h3>
                <button class="btn-secondary" style="width: auto; padding: 6px 12px; margin: 0;" onclick="goBack()">Back</button>
            </div>

            <div class="controls-row">
                <div style="flex: 1;">
                    <label>Filter by Rarity:</label>
                    <select id="rarityFilter" onchange="renderList()">
                        <option value="All">All Categories</option>
                        <option value="Common">Common</option>
                        <option value="Rare">Rare</option>
                        <option value="Legendary">Legendary</option>
                        <option value="Mythic">Mythic</option>
                        <option value="Godly">Godly</option>
                        <option value="Limited">Limited</option>
                        <option value="Shop">Shop Items</option>
                    </select>
                </div>
                <div style="flex: 1;">
                    <label>Apply Mutation Multiplier:</label>
                    <select id="mutationSelect" onchange="renderList()">
                        <option value="1">Normal (x1)</option>
                        <option value="5">Gold (x5)</option>
                        <option value="15">Diamond (x15)</option>
                        <option value="20">Crab (x20)</option>
                        <option value="25">Alien (x25)</option>
                    </select>
                </div>
            </div>

            <div id="characterList">
                <!-- Data will be injected here via JS -->
            </div>
        </div>
    </div>

    <script>
        // --- 1. DATA STRUCTURES COMBINED FROM IMAGES AND PROMPT --- //
        
        // Mappings based on prompt instructions
        const areaMapping = {
            "Common": "Forest Area",
            "Rare": "City Area",
            "Legendary": "Farm Area",
            "Mythic": "Volcano Area",
            "Godly": "Beach Area",
            "Limited": "Unknown/Event",
            "Shop": "Shop Area"
        };

        const rarityColors = {
            "Common": "#94a3b8",
            "Rare": "#3b82f6",
            "Legendary": "#f59e0b",
            "Mythic": "#ef4444",
            "Godly": "#a855f7",
            "Limited": "#ec4899",
            "Shop": "#10b981"
        };

        // Standard Characters extracted from 1000045401.jpg
        const standardCharacters = [
            { name: "Bananita Dolphinita", basePrice: 250, rarity: "Common" },
            { name: "Trippi Troppi", basePrice: 200, rarity: "Common" },
            { name: "Gangster Footera", basePrice: 55, rarity: "Common" },
            
            { name: "Ballerina Cappuccina", basePrice: 400, rarity: "Rare" },
            { name: "Svinina Bombardino", basePrice: 150, rarity: "Rare" },
            { name: "Bombombini Gusini", basePrice: 100, rarity: "Rare" },
            
            { name: "Cappuccino Assassino", basePrice: 550, rarity: "Legendary" },
            { name: "La Vacca Saturno", basePrice: 1200, rarity: "Legendary" },
            
            { name: "Crab Chef", basePrice: 1300, rarity: "Mythic" },
            { name: "Matteo", basePrice: 1500, rarity: "Mythic" },
            { name: "Tralalero Tralala", basePrice: 1800, rarity: "Mythic" },
            
            { name: "Giraffa Celestre", basePrice: 3000, rarity: "Godly" },
            { name: "Odin Din Din Dun", basePrice: 5000, rarity: "Godly" },
            { name: "Six Seven", basePrice: 6700, rarity: "Godly" },
            
            { name: "Strawberry Elephant", basePrice: 150000, rarity: "Limited" },
            { name: "Summerini Fattini", basePrice: 1500000, rarity: "Limited" }
        ];

        // Shop items combined from 1000045400.jpg (Per/s) and 1000045399.jpg (Price/Min/Max)
        const shopItems = [
            { name: "Boneca Ambalabu", price: 65000, perSecond: 25000, min: 1, max: 3, rarity: "Shop", originalRarity: "Rare" },
            { name: "Job Job Job Sahur", price: 155000, perSecond: 80000, min: 1, max: 2, rarity: "Shop", originalRarity: "Rare" },
            { name: "Trippi Troppi Troppa", price: 35000, perSecond: 10000, min: 2, max: 6, rarity: "Shop", originalRarity: "Common" },
            { name: "Esok Sekolah", price: 12000000, perSecond: 125000, min: 0, max: 1, rarity: "Shop", originalRarity: "Mythical" },
            { name: "Karkerkar Kurkur", price: 25000000000, perSecond: 115000, min: 0, max: 1, rarity: "Shop", originalRarity: "Mythical" },
            { name: "Chimpanzini Bananini", price: 10000, perSecond: 8000, min: 2, max: 7, rarity: "Shop", originalRarity: "Common" },
            { name: "Pot Hotspot", price: 125000, perSecond: 75000, min: 1, max: 3, rarity: "Shop", originalRarity: "Rare" }
        ];

        // --- 2. LOGIC AND UI CONTROL --- //

        // Check if user is already logged in on page load
        window.onload = () => {
            const savedUser = localStorage.getItem('gameHubUser');
            if (savedUser) {
                document.getElementById('welcomeText').innerText = `Welcome, ${JSON.parse(savedUser).name}`;
                switchScreen('selectionScreen');
            }
        };

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function handleLogin() {
            const name = document.getElementById('authName').value;
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            const errorElement = document.getElementById('loginError');

            if (!name || !email || !password) {
                errorElement.style.display = 'block';
                return;
            }
            
            errorElement.style.display = 'none';
            const userData = { name, email };
            
            // Save locally, not cloud base
            localStorage.setItem('gameHubUser', JSON.stringify(userData));
            
            document.getElementById('welcomeText').innerText = `Welcome, ${name}`;
            switchScreen('selectionScreen');
        }

        function logout() {
            localStorage.removeItem('gameHubUser');
            document.getElementById('authName').value = '';
            document.getElementById('authEmail').value = '';
            document.getElementById('authPassword').value = '';
            switchScreen('loginScreen');
        }

        function openGame(gameId) {
            if (gameId === 'brainrots') {
                switchScreen('brainrotsScreen');
                renderList();
            } else {
                alert("Crystal Collecting Simulator is coming soon! Progress saved locally.");
            }
        }

        function goBack() {
            switchScreen('selectionScreen');
        }

        // Render the database based on filters
        function renderList() {
            const container = document.getElementById('characterList');
            const filter = document.getElementById('rarityFilter').value;
            const mutationSelect = document.getElementById('mutationSelect');
            const mutationMultiplier = parseInt(mutationSelect.value);
            const mutationText = mutationSelect.options[mutationSelect.selectedIndex].text.split(' ')[0]; // Gets "Normal", "Gold", etc.

            container.innerHTML = ''; // Clear previous

            // Combine both arrays for rendering based on filter
            let itemsToRender = [];
            
            if (filter === "Shop") {
                itemsToRender = shopItems;
            } else if (filter === "All") {
                itemsToRender = [...standardCharacters, ...shopItems];
            } else {
                itemsToRender = standardCharacters.filter(char => char.rarity === filter);
            }

            if (itemsToRender.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#94a3b8;">No characters found in this category.</p>`;
                return;
            }

            itemsToRender.forEach(item => {
                const isShop = item.rarity === "Shop";
                const displayColor = isShop ? rarityColors[item.originalRarity] || rarityColors.Shop : rarityColors[item.rarity];
                const area = isShop ? areaMapping.Shop : (areaMapping[item.rarity] || "Unknown");
                
                // Calculate dynamic price based on mutation (applies mostly to standard, but calculated for all)
                const baseVal = isShop ? item.price : item.basePrice;
                const mutatedValue = baseVal * mutationMultiplier;

                let cardHTML = `
                    <div class="card" style="border-left-color: ${displayColor}">
                        <div class="card-header">
                            <span class="card-title">${item.name}</span>
                            <span class="badge" style="background-color: ${displayColor}33; color: ${displayColor};">
                                ${isShop ? `Shop [${item.originalRarity}]` : item.rarity}
                            </span>
                        </div>
                        <div class="grid-stats">
                            <div><span class="stat-label">Area:</span> <span style="color:#fff">${area}</span></div>
                            <div><span class="stat-label">Mutation:</span> <span style="color:#fff">${mutationText} (x${mutationMultiplier})</span></div>
                            <div><span class="stat-label">${isShop ? 'Price' : 'Cost/Price'}:</span> <span class="stat-value">${mutatedValue.toLocaleString()}</span></div>
                `;

                // Add shop specific data if applicable
                if (isShop) {
                    cardHTML += `
                            <div><span class="stat-label">Income (Per/s):</span> <span class="stat-value" style="color:#fbbf24">${(item.perSecond * mutationMultiplier).toLocaleString()}</span></div>
                            <div><span class="stat-label">Min Stock:</span> <span style="color:#fff">${item.min}</span></div>
                            <div><span class="stat-label">Max Stock:</span> <span style="color:#fff">${item.max}</span></div>
                    `;
                }

                cardHTML += `
                        </div>
                    </div>
                `;
                
                container.innerHTML += cardHTML;
            });
        }
    </script>
</body>
</html>
