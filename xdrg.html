<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xdrg Pilot Service</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #000;
            color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        #app {
            width: 100%;
            max-width: 480px;
            background: #0d0d0d;
            border-radius: 28px;
            overflow: hidden;
            border: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            min-height: 85vh;
            position: relative;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: #0f0f0f;
            border-bottom: 1px solid #2c2c2c;
        }
        .icon-btn {
            background: #1e1e1e;
            border: none;
            color: white;
            font-size: 1.2rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-btn:active { transform: scale(0.92); }
        .badge-dot {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 10px;
            height: 10px;
            background: #ff2a6d;
            border-radius: 50%;
            display: none;
        }
        .lang-selector {
            display: flex;
            gap: 8px;
            padding: 12px 20px;
            justify-content: flex-end;
        }
        .lang-btn {
            background: transparent;
            border: 1px solid #444;
            color: #aaa;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .lang-btn.active {
            background: #ff2a6d;
            border-color: #ff2a6d;
            color: white;
            font-weight: 600;
        }
        .screen {
            padding: 0 20px 20px;
            flex: 1;
            overflow-y: auto;
        }
        .hidden { display: none !important; }
        .card {
            background: #1a1a1a;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid #2c2c2c;
        }
        input {
            width: 100%;
            background: #222;
            border: 1px solid #3d3d3d;
            color: white;
            padding: 14px 16px;
            border-radius: 14px;
            font-size: 1rem;
            margin-bottom: 12px;
            outline: none;
        }
        input:focus { border-color: #ff2a6d; }
        .btn-primary {
            background: #ff2a6d;
            border: none;
            color: white;
            padding: 16px 24px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1.1rem;
            width: 100%;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn-primary:active { transform: scale(0.96); }
        .btn-secondary {
            background: #222;
            border: 1.5px solid #444;
            color: white;
            padding: 12px 20px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .btn-secondary:active { transform: scale(0.96); }
        .pilot-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 14px 0;
        }
        .pilot-option {
            background: #1e1e1e;
            border: 2px solid #3a3a3a;
            border-radius: 16px;
            padding: 14px 18px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-weight: 700;
        }
        .pilot-option.selected {
            border-color: #ff2a6d;
            background: #2a1a22;
        }
        .price-badge {
            background: #333;
            padding: 6px 12px;
            border-radius: 20px;
            color: #ffb300;
            font-size: 0.85rem;
        }
        .agree-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 16px 0;
            background: #1b1b1b;
            padding: 12px;
            border-radius: 16px;
        }
        .check-cross {
            display: flex;
            gap: 12px;
            margin: 12px 0;
        }
        .check-btn, .cross-btn {
            flex: 1;
            padding: 12px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            text-align: center;
        }
        .check-btn { background: #1e1e1e; color: #00c853; border: 2px solid #00c853; }
        .cross-btn { background: #1e1e1e; color: #ff1744; border: 2px solid #ff1744; }
        .check-btn.selected { background: #00c853; color: black; }
        .cross-btn.selected { background: #ff1744; color: white; }
        
        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0 10px;
        }
        .social-icon {
            font-size: 1.2rem;
            color: white;
            background: #222;
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            text-decoration: none;
        }
        .inbox-container {
            background: #141414;
            border-radius: 20px;
            padding: 16px;
            min-height: 180px;
            max-height: 380px;
            overflow-y: auto;
        }
        .message-bubble {
            background: #222;
            padding: 12px;
            border-radius: 14px;
            margin-bottom: 10px;
            border-left: 4px solid #ff2a6d;
        }
        .message-bubble.system {
            border-left: 4px solid #00e5ff;
            background: #1a252a;
        }
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translate(-50%, 0);
            background: #ff1744;
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            z-index: 10000;
            font-weight: 700;
            text-align: center;
            width: 88%;
            max-width: 380px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }
        .toast-success { background: #00c853; color: black; }
        label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: #aaa; }
    </style>
</head>
<body>

<div id="app">
    <div class="top-bar hidden" id="topBar">
        <button class="icon-btn" id="inboxBtn">📥<span class="badge-dot" id="inboxBadge"></span></button>
        <h2 style="font-size: 1.1rem;">⚡ Xdrg Pilot</h2>
        <button class="icon-btn" id="settingsBtn">⚙️</button>
    </div>

    <div class="lang-selector">
        <button class="lang-btn active" id="btnEn">English</button>
        <button class="lang-btn" id="btnTl">Tagalog</button>
    </div>

    <!-- AUTH SCREEN -->
    <div id="signinScreen" class="screen">
        <div class="card">
            <h2 id="authTitle" style="color: #ff2a6d; margin-bottom: 6px;">Sign In</h2>
            <p id="authSubtitle" style="font-size:0.85rem; color:#aaa; margin-bottom: 16px;">Welcome back! Please login</p>
            
            <input type="text" id="loginName" placeholder="Full Name" style="display: none;" />
            <input type="text" id="loginUsername" placeholder="Username" />
            <input type="password" id="loginPassword" placeholder="Password" />
            
            <button class="btn-primary" id="authBtn">Sign In</button>
            
            <p style="text-align:center; margin-top:15px; font-size:0.85rem; color:#aaa; cursor:pointer;" id="authToggle">
                <span id="toggleQuestion">Don't have an account?</span> <span id="toggleText" style="color:#ff2a6d; text-decoration:underline;">Register now</span>
            </p>
        </div>
        <div class="social-links">
            <a class="social-icon" href="https://www.facebook.com/share/1BiViKpPbt/" target="_blank">📘</a>
            <a class="social-icon" href="https://tiktok.com/@xdragon...1" target="_blank">🎵</a>
            <a class="social-icon" href="https://www.youtube.com/@dev-xdragon" target="_blank">▶️</a>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="mainScreen" class="screen hidden">
        <h2 style="color:#ff2a6d;">Welcome, <span id="welcomeUser">Pilot</span> 👋</h2>
        <p style="font-size:0.85rem; color:#aaa; margin-bottom:12px;">Select any Pilot set-up you want 👇</p>

        <div id="newMemberSection" class="hidden">
            <div class="card" style="border-color:#ff2a6d;">
                <h3>🔥 New Member Selection</h3>
                <div class="pilot-grid" id="newPilotGrid"></div>
            </div>
        </div>

        <div id="oldUserSection">
            <div class="card">
                <h3>🖥️ With 5min breaks / hr</h3>
                <div class="pilot-grid" id="breakPilotGrid"></div>
            </div>
            <div class="card">
                <h3>🤖 Without Break (Best)</h3>
                <div class="pilot-grid" id="nobreakPilotGrid"></div>
            </div>
        </div>

        <div class="agree-row">
            <input type="checkbox" id="agreeCheckbox" style="width:20px; height:20px;" />
            <span id="agreeLabel" style="font-size: 0.85rem;">Do you agree with Xdrg Pilot rules?</span>
        </div>
        <div class="check-cross">
            <button class="check-btn" id="agreeYes">✅ Yes</button>
            <button class="cross-btn" id="agreeNo">❎ No</button>
        </div>
        <button class="btn-primary" id="confirmPilotBtn">Confirm & Send to Owner</button>
    </div>

    <!-- INBOX -->
    <div id="inboxScreen" class="screen hidden">
        <h3 style="margin-bottom: 12px;">📥 Inbox</h3>
        <div id="inboxMessages" class="inbox-container"></div>
        <button class="btn-secondary" id="backFromInbox">← Back to Dashboard</button>
    </div>

    <!-- SETTINGS -->
    <div id="settingsScreen" class="screen hidden">
        <h3 style="margin-bottom: 12px;">⚙️ Profile & Settings</h3>
        <div class="card">
            <label>Name:</label>
            <input type="text" id="profileName" />
            <label>Username:</label>
            <input type="text" id="profileUsername" readonly style="opacity:0.6;" />
            <label>Payment Method Name:</label>
            <input type="text" id="paymentName" placeholder="GCash Name" />
            <label>Payment Number:</label>
            <input type="text" id="paymentNumber" placeholder="09xxxxxxxxx" />
            <label>Roblox Username:</label>
            <input type="text" id="pilotUsername" />
            <label>Roblox Password:</label>
            <input type="password" id="pilotPassword" />
            
            <button class="btn-primary" id="saveProfileBtn" style="background:#00e5ff; color:black;">💾 Save Profile</button>
            <button class="btn-secondary" id="logoutBtn" style="border-color:#ff1744; color:#ff1744; margin-top:15px;">🚪 Log Out</button>
        </div>
        <button class="btn-secondary" id="backFromSettings">← Back to Dashboard</button>
    </div>
</div>

<script>
    // CRASH SAFEGUARD
    window.onerror = function(msg) {
        showToast('System Error: ' + msg);
        return true;
    };

    function showToast(text, type = 'error') {
        const old = document.querySelector('.toast');
        if (old) old.remove();
        const t = document.createElement('div');
        t.className = 'toast ' + (type === 'success' ? 'toast-success' : '');
        t.innerText = text;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 2500);
    }

    // STATE
    let currentUser = null;
    try {
        const stored = localStorage.getItem('xdrg_user');
        if (stored) currentUser = JSON.parse(stored);
    } catch(e) {}

    let localMessages = JSON.parse(localStorage.getItem('xdrg_messages') || '[]');
    let selectedPilot = null;
    let agreeStatus = null;
    let isLoginMode = true;
    let currentLang = 'en';

    const newMemberPlans = [{ label: "30 Minute", price: "Free" }, { label: "2 Hour", price: "₱5" }, { label: "3 Hour", price: "₱12" }, { label: "4 Hour", price: "₱25" }, { label: "24 Hour", price: "₱899" }, { label: "24D/7H", price: "₱3499" }];
    const breakPlans = [{ label: "30 minute", price: "₱35" }, { label: "2 Hour", price: "₱110" }, { label: "3 Hour", price: "₱159" }, { label: "4 Hour", price: "₱229" }, { label: "24 Hour", price: "₱1100" }, { label: "24D/7H", price: "₱4299" }];
    const noBreakPlans = [{ label: "30 minute", price: "₱65" }, { label: "2 Hour", price: "₱128" }, { label: "3 Hour", price: "₱179" }, { label: "4 Hour", price: "₱249" }, { label: "24 Hour", price: "₱1299" }, { label: "24D/7H", price: "₱4599" }];

    function renderGrids() {
        buildGrid('newPilotGrid', newMemberPlans, 'new');
        buildGrid('breakPilotGrid', breakPlans, 'break');
        buildGrid('nobreakPilotGrid', noBreakPlans, 'nobreak');
    }

    function buildGrid(id, plans, cat) {
        const box = document.getElementById(id);
        if (!box) return;
        box.innerHTML = '';
        plans.forEach(p => {
            const div = document.createElement('div');
            div.className = 'pilot-option';
            div.innerHTML = `<span>${p.label}</span><span class="price-badge">${p.price}</span>`;
            div.onclick = function() {
                document.querySelectorAll('.pilot-option').forEach(el => el.classList.remove('selected'));
                this.classList.add('selected');
                selectedPilot = { category: cat, label: p.label, price: p.price };
            };
            box.appendChild(div);
        });
    }

    function showScreen(name) {
        document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
        document.getElementById('topBar').classList.add('hidden');

        if (name === 'main' && currentUser) {
            document.getElementById('topBar').classList.remove('hidden');
            document.getElementById('mainScreen').classList.remove('hidden');
            document.getElementById('welcomeUser').innerText = currentUser.name || currentUser.username;
            
            const isNew = (Date.now() - new Date(currentUser.created_at || Date.now()).getTime()) < 86400000;
            document.getElementById('newMemberSection').classList.toggle('hidden', !isNew);
            document.getElementById('oldUserSection').classList.toggle('hidden', isNew);
        } else if (name === 'signin') {
            document.getElementById('signinScreen').classList.remove('hidden');
        } else if (name === 'inbox') {
            document.getElementById('topBar').classList.remove('hidden');
            document.getElementById('inboxScreen').classList.remove('hidden');
            document.getElementById('inboxBadge').style.display = 'none';
            renderInbox();
        } else if (name === 'settings') {
            document.getElementById('topBar').classList.remove('hidden');
            document.getElementById('settingsScreen').classList.remove('hidden');
            loadSettings();
        }
    }

    // AUTH BUTTON CLICK
    document.getElementById('authBtn').onclick = function() {
        const u = document.getElementById('loginUsername').value.trim();
        const p = document.getElementById('loginPassword').value.trim();
        const n = document.getElementById('loginName').value.trim();

        if (!u || !p || (!isLoginMode && !n)) {
            showToast('Please fill in all fields!');
            return;
        }

        currentUser = { username: u, password: p, name: isLoginMode ? u : n, created_at: new Date().toISOString() };
        localStorage.setItem('xdrg_user', JSON.stringify(currentUser));
        showToast(isLoginMode ? 'Logged in successfully!' : 'Account registered!', 'success');
        showScreen('main');
    };

    // AUTH TOGGLE CLICK
    document.getElementById('authToggle').onclick = function() {
        isLoginMode = !isLoginMode;
        document.getElementById('authTitle').innerText = isLoginMode ? 'Sign In' : 'Register';
        document.getElementById('authSubtitle').innerText = isLoginMode ? 'Welcome back! Please login' : 'Create a new account';
        document.getElementById('authBtn').innerText = isLoginMode ? 'Sign In' : 'Register';
        document.getElementById('toggleQuestion').innerText = isLoginMode ? "Don't have an account?" : "Already have an account?";
        document.getElementById('toggleText').innerText = isLoginMode ? "Register now" : "Sign in";
        document.getElementById('loginName').style.display = isLoginMode ? 'none' : 'block';
    };

    // AGREEMENT
    function setAgree(val) {
        agreeStatus = val;
        document.getElementById('agreeCheckbox').checked = (val === 'yes');
        document.getElementById('agreeYes').classList.toggle('selected', val === 'yes');
        document.getElementById('agreeNo').classList.toggle('selected', val === 'no');
    }
    document.getElementById('agreeYes').onclick = () => setAgree('yes');
    document.getElementById('agreeNo').onclick = () => setAgree('no');
    document.getElementById('agreeCheckbox').onchange = (e) => setAgree(e.target.checked ? 'yes' : null);

    // CONFIRM
    document.getElementById('confirmPilotBtn').onclick = function() {
        if (!selectedPilot) return showToast('Please tap a Pilot plan first!');
        if (agreeStatus !== 'yes') return showToast('Please agree to rules (Tap Yes)');

        const userMsg = { username: currentUser.username, message: `Pilot Selected: ${selectedPilot.label} (${selectedPilot.price})`, created_at: new Date().toISOString() };
        const sysMsg = { username: currentUser.username, message: `🤖 SYSTEM: Your pilot order (${selectedPilot.label}) has been received!`, created_at: new Date().toISOString() };
        
        localMessages.unshift(sysMsg, userMsg);
        localStorage.setItem('xdrg_messages', JSON.stringify(localMessages));

        showToast('Sent to Owner successfully!', 'success');
        document.getElementById('inboxBadge').style.display = 'block';
        selectedPilot = null;
        setAgree(null);
        document.querySelectorAll('.pilot-option').forEach(el => el.classList.remove('selected'));
    };

    function renderInbox() {
        const box = document.getElementById('inboxMessages');
        if (!localMessages.length) {
            box.innerHTML = '<p style="font-size:0.85rem; color:#aaa;">No messages yet.</p>';
            return;
        }
        box.innerHTML = localMessages.map(m => `
            <div class="message-bubble ${m.message.includes('SYSTEM') ? 'system' : ''}">
                <strong>${m.message.includes('SYSTEM') ? '⚙️ Admin System' : currentUser.name}</strong>
                <p style="margin:4px 0;">${m.message}</p>
                <span style="font-size:0.75rem; color:#888;">${new Date(m.created_at).toLocaleTimeString()}</span>
            </div>
        `).join('');
    }

    function loadSettings() {
        document.getElementById('profileName').value = currentUser.name || '';
        document.getElementById('profileUsername').value = currentUser.username || '';
        document.getElementById('paymentName').value = currentUser.payment_name || '';
        document.getElementById('paymentNumber').value = currentUser.payment_number || '';
        document.getElementById('pilotUsername').value = currentUser.pilot_username || '';
        document.getElementById('pilotPassword').value = currentUser.pilot_password || '';
    }

    document.getElementById('saveProfileBtn').onclick = function() {
        currentUser.name = document.getElementById('profileName').value;
        currentUser.payment_name = document.getElementById('paymentName').value;
        currentUser.payment_number = document.getElementById('paymentNumber').value;
        currentUser.pilot_username = document.getElementById('pilotUsername').value;
        currentUser.pilot_password = document.getElementById('pilotPassword').value;
        localStorage.setItem('xdrg_user', JSON.stringify(currentUser));
        showToast('Profile Saved!', 'success');
    };

    document.getElementById('logoutBtn').onclick = function() {
        currentUser = null;
        localStorage.removeItem('xdrg_user');
        showScreen('signin');
    };

    // NAVIGATION
    document.getElementById('inboxBtn').onclick = () => showScreen('inbox');
    document.getElementById('settingsBtn').onclick = () => showScreen('settings');
    document.getElementById('backFromInbox').onclick = () => showScreen('main');
    document.getElementById('backFromSettings').onclick = () => showScreen('main');

    // LANGUAGE SWITCH
    document.getElementById('btnEn').onclick = function() {
        this.classList.add('active');
        document.getElementById('btnTl').classList.remove('active');
    };
    document.getElementById('btnTl').onclick = function() {
        this.classList.add('active');
        document.getElementById('btnEn').classList.remove('active');
    };

    // INIT
    renderGrids();
    if (currentUser) {
        showScreen('main');
    } else {
        showScreen('signin');
    }
</script>
</body>
</html>
