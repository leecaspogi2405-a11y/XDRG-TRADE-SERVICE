<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scripts Hub - Roblox Scripts</title>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0c0f24;
            --container-bg: #131631;
            --text-color: #ffffff;
            --sub-text: #b1b5c6;
            --primary-purple: #7a5dfa;
            --hover-purple: #9078fc;
            --accent-yellow: #fdb927;
            --warning-red: #ea2637;
            --border-color: #1a1e42;
            --input-bg: #1a1e42;
            --input-text: #ffffff;
            --tag-bg: rgba(255, 255, 255, 0.1);
            --success-green: #4cd964;
        }

        [data-theme="light"] {
            --bg-color: #f0f2f5;
            --container-bg: #ffffff;
            --text-color: #1c1e21;
            --sub-text: #606770;
            --border-color: #dddfe2;
            --input-bg: #f5f6f7;
            --input-text: #1c1e21;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: var(--container-bg);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            height: 40px;
            border-radius: 50%;
        }

        .site-title {
            font-size: 1.5em;
            font-weight: bold;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .theme-toggle {
            cursor: pointer;
            font-size: 1.2em;
            color: var(--sub-text);
        }

        button.login-btn, button.signup-btn, button.upload-btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button.login-btn {
            background-color: transparent;
            color: var(--sub-text);
            border: 1px solid var(--border-color);
        }

        button.signup-btn, button.upload-btn {
            background-color: var(--primary-purple);
            color: white;
        }

        .user-stats {
            padding: 15px 30px;
            font-size: 0.9em;
            color: var(--sub-text);
            display: flex;
            gap: 20px;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot-green { width: 10px; height: 10px; background-color: var(--success-green); border-radius: 50%; }
        .dot-blue { width: 10px; height: 10px; background-color: #38a1f3; border-radius: 50%; }

        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 30px;
        }

        .search-container {
            display: flex;
            align-items: center;
            gap: 15px;
            background-color: var(--container-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .search-container input {
            flex-grow: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--input-text);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .scripts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .script-card {
            background-color: var(--container-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .script-card-header {
            position: relative;
            height: 180px;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .script-card-header img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .script-card-header-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 0.8em;
        }

        .script-tag {
            background-color: var(--tag-bg);
            padding: 4px 10px;
            border-radius: 4px;
        }

        .key-system-tag {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background-color: var(--accent-yellow);
            color: #000;
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.8em;
            text-decoration: none;
        }

        .price-tag {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background-color: var(--primary-purple);
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.8em;
        }

        .script-card-content {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .owner-name { font-size: 0.85em; color: var(--sub-text); }
        .script-title { font-weight: bold; font-size: 1.1em; margin: 5px 0 15px 0; }

        .copy-btn {
            margin-top: auto;
            width: 100%;
            padding: 10px;
            background-color: var(--primary-purple);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
            opacity: 0; visibility: hidden;
            transition: opacity 0.3s;
        }

        .modal-overlay.active { opacity: 1; visibility: visible; }

        .modal {
            background-color: var(--container-bg);
            padding: 25px;
            border-radius: 12px;
            width: 450px;
            max-width: 90%;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .modal-back-btn {
            position: absolute; top: 15px; left: 15px;
            background: none; border: none; color: var(--sub-text);
            font-size: 1.2em; cursor: pointer;
        }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.9em; }

        .modal input, .modal select, .modal textarea {
            width: 100%; padding: 10px; border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg); color: var(--input-text);
            box-sizing: border-box;
        }

        .modal textarea { height: 90px; resize: vertical; font-family: monospace; }

        .modal-submit-btn {
            width: 100%; padding: 12px; background-color: var(--primary-purple);
            color: white; border: none; border-radius: 6px; font-weight: bold;
            cursor: pointer; margin-top: 10px;
        }

        .danger-tag {
            background-color: var(--warning-red);
            color: white; padding: 8px; border-radius: 6px;
            font-size: 0.8em; text-align: center; margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="https://cdn.discordapp.com/attachments/1501879351292067950/1511976415632031754/orca-image-746284181.jpeg.jpg?ex=6a7abdc4&is=6a796c44&hm=68d1c46079e6a19e7f864afd18260281ae94fe0d6b45f8b2b693a654d59b2abe&" alt="Logo" class="logo">
            <div class="site-title">Hub</div>
        </div>
        <div class="header-actions">
            <div class="theme-toggle" onclick="toggleTheme()">🌙</div>
            <span id="userDisplay" style="display:none; color: var(--success-green); font-weight:bold;"></span>
            <button class="login-btn" id="loginBtn" onclick="openModal('loginModal')">Login</button>
            <button class="signup-btn" id="signupBtn" onclick="openModal('signupModal')">Sign Up</button>
        </div>
    </header>

    <div class="user-stats">
        <div class="stat"><span class="dot-green"></span> Live Database Connected</div>
        <div class="stat"><span class="dot-blue"></span> 897 Guests online</div>
    </div>

    <div class="main-container">
        <div class="search-container">
            🔍 <input type="text" id="searchInput" placeholder="Try &quot;jailbreak&quot;" onkeyup="searchScripts()">
        </div>

        <div class="section-header">
            <div style="font-size: 1.5em; font-weight: bold;">Recent Scripts</div>
            <button class="upload-btn" onclick="openModal('uploadModal')">⊕ Upload</button>
        </div>

        <div class="scripts-grid" id="scriptsGrid">
            <!-- Dynamic scripts from Supabase will load here -->
        </div>
    </div>

    <!-- Login Modal -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal">
            <h2>Login</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" id="loginEmail" required>
                </div>
                <div class="form-group">
                    <label>Password *</label>
                    <input type="password" id="loginPassword" required>
                </div>
                <button type="submit" class="modal-submit-btn">Login</button>
            </form>
        </div>
    </div>

    <!-- Sign Up Modal -->
    <div class="modal-overlay" id="signupModal">
        <div class="modal">
            <h2>Sign Up</h2>
            <form id="signupForm">
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" id="signupEmail" required>
                </div>
                <div class="form-group">
                    <label>Username (optional)</label>
                    <input type="text" id="signupUsername">
                </div>
                <div class="form-group">
                    <label>Password *</label>
                    <input type="password" id="signupPassword" required>
                </div>
                <div class="danger-tag">If You agree that's your own risk</div>
                <button type="submit" class="modal-submit-btn">Sign Up</button>
            </form>
        </div>
    </div>

    <!-- Upload Modal -->
    <div class="modal-overlay" id="uploadModal">
        <div class="modal">
            <h2>Upload Script</h2>
            <form id="uploadForm">
                <div class="form-group">
                    <label>Image (URL or File Upload) *</label>
                    <input type="file" id="scriptFile" accept="image/*">
                </div>
                <div class="form-group">
                    <label>Title *</label>
                    <input type="text" id="scriptTitleInput" required>
                </div>
                <div class="form-group">
                    <label>Code Script *</label>
                    <textarea id="scriptCodeInput" placeholder="loadstring(game:HttpGet('...'))()" required></textarea>
                </div>
                <div class="form-group">
                    <label>Key System (Optional Link)</label>
                    <input type="text" id="keySystemInput" placeholder="https://keysystem.com">
                </div>
                <div class="form-group">
                    <label>Price ($) - 0 for Free *</label>
                    <input type="number" id="scriptPriceInput" value="0" min="0" required>
                </div>
                <button type="submit" class="modal-submit-btn">Next / Submit</button>
            </form>
        </div>
    </div>

    <!-- Payment Modal -->
    <div class="modal-overlay" id="paymentModal">
        <div class="modal">
            <button class="modal-back-btn" onclick="goBackToUpload()">← Back</button>
            <h2 style="margin-top:20px;">Payment Details</h2>
            <form id="paymentForm">
                <div class="form-group">
                    <label>Payment Method *</label>
                    <select id="paymentMethod" required>
                        <option value="GCash">GCash</option>
                        <option value="Maya">Maya</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Number *</label>
                    <input type="text" id="paymentNumber" placeholder="09123456789" required>
                </div>
                <div class="form-group">
                    <label>Account Name *</label>
                    <input type="text" id="paymentName" placeholder="Juan Dela Cruz" required>
                </div>
                <button type="submit" class="modal-submit-btn">Verify & Post Script</button>
            </form>
        </div>
    </div>

    <script>
        // Initialize Supabase Client
        const SUPABASE_URL = "https://qwfdxojphubvpalargbe.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3ZmR4b2pwaHVidnBhbGFyZ2JlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzNzk2NjEsImV4cCI6MjEwMTk1NTY2MX0.t6Vb4xpPfatVAimvrT5OoNxcd9eyInilxRxmTIW2siU";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let pendingUploadData = null;

        // Theme Toggle
        function toggleTheme() {
            const body = document.body;
            body.setAttribute('data-theme', body.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
        }

        // Modals
        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        document.querySelectorAll('.modal-overlay').forEach(m => m.addEventListener('click', e => { if(e.target === m) m.classList.remove('active'); }));

        // Auth Logic
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const username = document.getElementById('signupUsername').value || email.split('@')[0];

            const { data, error } = await supabase.auth.signUp({
                email, password,
                options: { data: { username: username } }
            });

            if (error) alert("Signup Error: " + error.message);
            else {
                alert("Account created successfully!");
                closeModal('signupModal');
                checkUser();
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) alert("Login Error: " + error.message);
            else {
                alert("Logged in successfully!");
                closeModal('loginModal');
                checkUser();
            }
        });

        async function checkUser() {
            const { data: { user } } = await supabase.auth.getUser();
            if (user) {
                currentUser = user;
                document.getElementById('userDisplay').innerText = user.user_metadata.username || user.email;
                document.getElementById('userDisplay').style.display = 'inline';
                document.getElementById('loginBtn').style.display = 'none';
                document.getElementById('signupBtn').style.display = 'none';
            }
        }

        // Upload Workflow
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('scriptFile');
            const file = fileInput.files[0];
            let imageUrl = "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=500&q=80";

            if (file) {
                imageUrl = await new Promise(resolve => {
                    const reader = new FileReader();
                    reader.onload = e => resolve(e.target.result);
                    reader.readAsDataURL(file);
                });
            }

            pendingUploadData = {
                title: document.getElementById('scriptTitleInput').value,
                script_code: document.getElementById('scriptCodeInput').value,
                key_link: document.getElementById('keySystemInput').value,
                price: parseFloat(document.getElementById('scriptPriceInput').value),
                image_url: imageUrl,
                owner_name: currentUser ? (currentUser.user_metadata.username || currentUser.email) : 'Guest'
            };

            if (pendingUploadData.price > 0) {
                closeModal('uploadModal');
                openModal('paymentModal');
            } else {
                saveScriptToSupabase(pendingUploadData);
            }
        });

        document.getElementById('paymentForm').addEventListener('submit', (e) => {
            e.preventDefault();
            saveScriptToSupabase(pendingUploadData);
            closeModal('paymentModal');
        });

        function goBackToUpload() {
            closeModal('paymentModal');
            openModal('uploadModal');
        }

        async function saveScriptToSupabase(data) {
            const { error } = await supabase.from('scripts').insert([data]);
            if (error) {
                alert("Failed to save script: " + error.message);
            } else {
                alert("Script posted successfully!");
                closeModal('uploadModal');
                document.getElementById('uploadForm').reset();
                fetchScripts();
            }
        }

        // Fetch Scripts from Supabase Real-time Database
        async function fetchScripts() {
            const { data, error } = await supabase
                .from('scripts')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error("Fetch Error:", error);
                return;
            }

            renderScripts(data);
        }

        function renderScripts(scripts) {
            const grid = document.getElementById('scriptsGrid');
            grid.innerHTML = '';

            scripts.forEach(s => {
                const card = document.createElement('div');
                card.className = 'script-card';

                const keyTag = s.key_link ? `<a href="${s.key_link}" target="_blank" class="key-system-tag">Key System</a>` : '';
                const priceTag = s.price > 0 ? `<div class="price-tag">$${s.price}</div>` : `<div class="price-tag">Free</div>`;

                card.innerHTML = `
                    <div class="script-card-header">
                        <img src="${s.image_url}" alt="Script Banner">
                        <div class="script-card-header-overlay">
                            <div class="script-tag">👁 ${s.views || 1}</div>
                            <div class="script-tag">Recent</div>
                        </div>
                        ${keyTag}
                        ${priceTag}
                    </div>
                    <div class="script-card-content">
                        <div class="owner-name">Owner: ${s.owner_name}</div>
                        <div class="script-title">${s.title}</div>
                        <button class="copy-btn" onclick="copyCode(\`${escapeQuotes(s.script_code)}\`)">📋 Copy Script</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function escapeQuotes(str) {
            return str ? str.replace(/`/g, '\\`').replace(/\$/g, '\\$') : '';
        }

        function copyCode(code) {
            navigator.clipboard.writeText(code).then(() => {
                alert("Script copied to clipboard!");
            }).catch(err => {
                alert("Failed to copy code: " + err);
            });
        }

        async function searchScripts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const { data } = await supabase.from('scripts').select('*').ilike('title', `%${query}%`);
            if (data) renderScripts(data);
        }

        // On Load
        checkUser();
        fetchScripts();
    </script>
</body>
</html>
