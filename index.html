<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XDRG TRADING SERVICE.ROBLOX</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --panel-bg: #161920;
            --accent-color: #00ffaa;
            --text-color: #ffffff;
            --text-muted: #7f8c9d;
            --border-color: #242b35;
            --decline-color: #ff4a4a;
            --accept-color: #00cc7a;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }

        header {
            background-color: var(--panel-bg);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .site-logo {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: var(--accent-color);
            letter-spacing: 1px;
        }

        .nav-buttons button {
            background-color: transparent;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            margin-left: 10px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }

        .nav-buttons button:hover {
            background-color: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .controls-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .nav-tabs button, .game-filter-select, .search-bar-input {
            background-color: var(--panel-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 16px;
        }

        .nav-tabs button { cursor: pointer; }

        .nav-tabs button.active {
            background-color: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
            font-weight: bold;
        }

        .search-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .search-bar-input {
            width: 250px;
            padding: 10px;
        }

        .search-bar-input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: var(--panel-bg);
            padding: 30px;
            border-radius: 8px;
            width: 100%;
            max-width: 450px;
            border: 1px solid var(--border-color);
        }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; color: #bbb; font-size: 14px; }
        .form-group input, .form-group select {
            width: 100%; padding: 10px; background-color: #0f1115;
            border: 1px solid var(--border-color); color: var(--text-color);
            border-radius: 4px; box-sizing: border-box;
        }

        .item-grid { display: flex; flex-direction: column; gap: 20px; }
        .item-card { background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
        .item-main-content { display: flex; flex-direction: row; align-items: stretch; }
        
        .item-image-container {
            width: 160px; background-color: #0f1115; display: flex; justify-content: center;
            align-items: center; font-size: 50px; border-right: 1px solid var(--border-color); flex-shrink: 0;
            height: 160px; overflow: hidden;
        }
        .item-image-container img { width: 100%; height: 100%; object-fit: cover; }
        
        .item-details { padding: 20px; display: flex; flex-direction: column; gap: 6px; flex-grow: 1; justify-content: center; }
        .item-game-badge { background-color: #242b35; color: var(--accent-color); display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; width: fit-content; }
        .item-title { font-size: 20px; font-weight: bold; margin: 4px 0; color: #fff; }
        .item-stat { font-size: 14px; color: var(--text-muted); }
        .item-stat strong { color: #fff; }
        
        .verified-badge { width: 16px; height: 16px; vertical-align: middle; margin-left: 4px; display: inline-block; }
        
        .interaction-bar { background-color: #1a1f29; padding: 10px 20px; border-top: 1px solid var(--border-color); display: flex; gap: 15px; align-items: center; }
        .interact-btn { background: transparent; border: 1px solid var(--border-color); color: var(--text-color); padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; display: flex; align-items: center; gap: 5px; }
        .interact-btn:hover { border-color: var(--accent-color); color: var(--accent-color); }
        .trade-action-btn { background-color: var(--accent-color) !important; color: #000 !important; margin-left: auto; }
        
        .comments-section { background-color: #12151c; padding: 15px 20px; border-top: 1px solid var(--border-color); }
        .comment-box { display: flex; gap: 10px; margin-bottom: 10px; }
        .comment-box input { flex-grow: 1; padding: 8px; background-color: #0f1115; border: 1px solid var(--border-color); color: #fff; border-radius: 4px; }
        .comment-list { max-height: 150px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .comment-item { font-size: 13px; background: #161920; padding: 6px 10px; border-radius: 4px; border-left: 3px solid var(--accent-color); }
        
        .inbox-card { background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; margin-bottom: 15px; }
        .inbox-actions { margin-top: 15px; display: flex; gap: 10px; }
        .btn-accept { background-color: var(--accept-color); color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-decline { background-color: var(--decline-color); color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .ps-link { display: inline-block; background-color: #0077ff; color: white; text-decoration: none; padding: 6px 12px; border-radius: 4px; font-size: 13px; font-weight: bold; width: fit-content; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="https://cdn.discordapp.com/attachments/1501911631708422215/1519291570048860322/orca-image-1542816814.jpeg.jpg?ex=6a3d0609&is=6a3bb489&hm=2e089cbe47c460fa52c8c9c1d9ce5504ffbc549325956153b8d5698da440c15a&" alt="Site Logo" class="site-logo">
            <div class="logo">XDRG TRADING SERVICE.ROBLOX</div>
        </div>
        <div class="nav-buttons" id="authButtons">
            <span id="userGreeting" style="margin-right: 15px; color: var(--accent-color); font-weight: bold;"></span>
            <button onclick="window.openModal('loginModal')" id="loginBtn">Sign Up / Log In</button>
            <button onclick="window.logout()" id="logoutBtn" class="hidden">Log Out</button>
        </div>
    </header>

    <div class="container">
        <div class="controls-section">
            <div class="nav-tabs">
                <button class="active" id="viewTab" onclick="window.switchTab('view')">View Listings</button>
                <button id="uploadTab" onclick="window.switchTab('upload')">+ Upload Item</button>
                <button id="inboxTab" onclick="window.switchTab('inbox')">📥 Inbox <span id="inboxBadge" style="color:var(--accent-color); font-weight:bold;"></span></button>
            </div>

            <div class="search-container">
                <input type="text" id="userSearchBar" class="search-bar-input" placeholder="🔍 Search friend's email..." oninput="window.renderItems()">
                <select id="gameFilter" class="game-filter-select" onchange="window.renderItems()">
                    <option value="All">All Games</option>
                    <option value="Grow A Garden">Grow A Garden (GaG)</option>
                    <option value="Grow A Garden 2">Grow A Garden 2 (GaG 2)</option>
                    <option value="Steal A Brainrot">Steal A Brainrot (SAB)</option>
                    <option value="Kick A Lucky Block">Kick A Lucky Block (KALB)</option>
                    <option value="Blox Fruits">Blox Fruits (BF)</option>
                </select>
            </div>
        </div>

        <div id="feedSection">
            <div class="item-grid" id="itemGrid"></div>
        </div>

        <div id="inboxSection" class="hidden">
            <h2 style="color: var(--accent-color); margin-top: 0;">Your Trade Offers & Messaging Inbox</h2>
            <div id="inboxGrid"></div>
        </div>

        <div id="uploadSection" class="hidden" style="max-width: 600px; margin: 0 auto; background: var(--panel-bg); padding: 30px; border-radius: 8px; border: 1px solid var(--border-color);">
            <h2 id="uploadFormHeader" style="margin-top:0; color: var(--accent-color);">Post Trade Item</h2>
            <form id="uploadForm" onsubmit="window.handleUpload(event)">
                
                <div class="form-group">
                    <label>Game Type:</label>
                    <select id="formGameType" onchange="window.updateFormFields()" required>
                        <option value="Grow A Garden">Grow A Garden (GaG)</option>
                        <option value="Grow A Garden 2">Grow A Garden 2 (GaG 2)</option>
                        <option value="Steal A Brainrot">Steal A Brainrot (SAB)</option>
                        <option value="Kick A Lucky Block">Kick A Lucky Block (KALB)</option>
                        <option value="Blox Fruits">Blox Fruits (BF)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Select Item Name:</label>
                    <select id="formItemName" onchange="window.checkCustomItem()" required></select>
                </div>

                <div class="form-group hidden" id="fieldCustomItem">
                    <label style="color: var(--accent-color); font-weight: bold;">Type Custom Item Name:</label>
                    <input type="text" id="formCustomItemName" placeholder="Enter the exact missing item name...">
                </div>

                <div class="form-group">
                    <label>Initial Product Inventory Stock Count:</label>
                    <input type="number" id="formStock" value="1" min="1" placeholder="e.g. 10" required>
                </div>

                <div class="form-group">
                    <label>Upload Image Directly From Files (+):</label>
                    <input type="file" id="formImage" accept="image/*" onchange="window.previewImage(event)">
                    <input type="hidden" id="imageDataUrl">
                </div>

                <div class="form-group" id="fieldWorth">
                    <label id="labelWorth">Value / Worth:</label>
                    <input type="text" id="formWorth" placeholder="Enter target trade value/price expectations...">
                </div>

                <div class="form-group" id="fieldKg">
                    <label>Weight (KG):</label>
                    <input type="text" id="formKg" placeholder="e.g., 45 kg">
                </div>

                <div class="form-group" id="fieldMutation">
                    <label>Mutation Variant / Trait Aura:</label>
                    <input type="text" id="formMutation" placeholder="e.g., Glitched, Shiny, Shadow, Overlord">
                </div>

                <div class="form-group">
                    <label>Your Verified Profile Identity (Session Protected Email):</label>
                    <input type="text" id="formUserIdentity" style="background-color: #1a1f26; color: var(--accent-color); font-weight: bold;" required readonly>
                </div>

                <div class="form-group">
                    <label>Private Server Link (Optional):</label>
                    <input type="url" id="formPsLink" placeholder="https://www.roblox.com/games/share?code=...">
                </div>

                <button type="submit" id="formSubmitBtn" style="background: var(--accent-color); color: #000; padding: 12px; width: 100%; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer;">Post Item Details</button>
            </form>
        </div>
    </div>

    <div id="loginModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle" style="margin-top:0; color:var(--accent-color); font-size: 20px;">Secure Email Access Portal</h3>
            <p style="font-size:13px; color:var(--text-muted); margin-bottom: 20px;">Please authenticate utilizing your secure account email format verification line to securely track correspondence logs and trade requests.</p>
            <div class="form-group">
                <label>Enter Registered Account Email:</label>
                <input type="email" id="authEmail" placeholder="creator@example.com" required>
            </div>
            <button onclick="window.login()" style="background: var(--accent-color); color: #000; padding: 12px; width: 100%; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold;">Verify & Register Identity</button>
            <button onclick="window.closeModal('loginModal')" style="background: transparent; color: var(--text-muted); padding: 10px; width: 100%; border: none; cursor: pointer; margin-top: 5px;">Cancel</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD8cWqDhvzq2qGMeiFICTcFLAXSlg1rne0",
            authDomain: "xdrg-trade-service.firebaseapp.com",
            projectId: "xdrg-trade-service",
            storageBucket: "xdrg-trade-service.firebasestorage.app",
            messagingSenderId: "560761615319",
            appId: "1:560761615319:web:7bf9834c997298c2231192",
            databaseURL: "https://xdrg-trade-service-default-rtdb.firebaseio.com/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const gameItemsDatabase = {
            "Grow A Garden": { items: ["Radiant Sun Sprout", "Shadow Tendril Spore", "Void Lily Seed", "Crystalline Cactus Seed", "Sparkcap Spore", "Inferno Vine Seed", "Glacial Rose Seed", "Chrono Clover Seed", "Plasma Pod", "Nebula Orchid Seed", "Elderwood Sapling", "Toxic Bramble Seed", "Matrix Root Shard", "Cosmic Singularity Seed", "Amethyst Sprout", "Cyber Shroom Spore", "Aurora Blossom Seed"], fields: { worth: "Coin Value", kg: true, mutation: true } },
            "Grow A Garden 2": { items: ["Moon Bloom Seed", "Dragon's Breath Seed", "Ghost Pepper Seed", "Venus Fly Trap Seed", "Venom Spitter Seed", "Poison Apple Seed", "Magic Mushroom Seed", "Golden Leaf Seed", "Bamboo Seed", "Poison Ivy Seed", "Pomegranate Seed", "Sunflower Seed", "Glow Mushroom Seed", "Horned Melon Seed", "Dragon Fruit Seed", "Carrot Seed", "Strawberry Seed", "Blueberry Seed", "Tomato Seed", "Green Bean Seed", "Corn Seed", "Banana Seed", "Grape Seed", "Mango Seed", "Tulip Seed", "Baby Cactus Seed", "Cactus Seed"], fields: { worth: "Night Essence Crystals", kg: true, mutation: true } },
            "Steal A Brainrot": { items: ["Garama", "Madundung", "La Taco Combinasion", "Hydra Dragon Cannelloni", "Burguro", "Fryuro", "Lavadorito Spinito", "Ketupat Kepat", "Strawberry Elephant", "Cooki and Milki", "Esok Sekolah", "Spinny Hammy GALAXY", "Ketchuru", "Musturu", "Los Candies", "Cerberus", "La Secret Combinasion", "Mieteteira Bicicleteira", "List List List Sahur", "Chicleteria Noelteira", "Los Nooo My Hotspitsitos", "Skibidi Toilet Box", "Grimace Shake Formula", "Sigma Core Alpha", "GigaChad Slab"], fields: { worth: "Passive M/s Valuation", kg: false, mutation: true } },
            "Kick A Lucky Block": { items: ["Mythic Base Unit", "Celestial Base Unit", "Legendary Base Unit", "Rare Base Unit", "Common Base Unit", "Uncommon Base Unit", "Epic Base Unit", "Noobini Pizzalini", "Austroman Statue", "Gangster Footera", "Sigma Diamond Crown", "Alpha Wolf Trophy", "Skibidi Subwoofer", "Rizzler Pillar", "Void Matrix Block", "Chaos Matrix Cube", "Galaxy Singularity Block", "Quantum Core Block"], fields: { worth: "Multiplier Value Rate", kg: true, mutation: false } },
            "Blox Fruits": { items: ["Kitsune Fruit (Physical)", "Dragon Fruit (Physical)", "Leopard Fruit (Physical)", "Dough Fruit (Physical)", "T-Rex Fruit (Physical)", "Mammoth Fruit (Physical)", "Spirit Fruit (Physical)", "Control Fruit (Physical)", "Venom Fruit (Physical)", "Shadow Fruit (Physical)", "Gravity Fruit (Physical)", "Buddha Fruit (Physical)", "Portal Fruit (Physical)", "Rumble Fruit (Physical)", "Blizzard Fruit (Physical)", "Sound Fruit (Physical)", "Pain Fruit (Physical)", "Quake Fruit (Physical)", "Love Fruit (Physical)", "Spider Fruit (Physical)", "Phoenix Fruit (Physical)", "Ghost Fruit (Physical)", "Magma Fruit (Physical)", "Light Fruit (Physical)", "Rubber Fruit (Physical)", "Barrier Fruit (Physical)", "Diamond Fruit (Physical)", "Ice Fruit (Physical)", "Sand Fruit (Physical)", "Dark Fruit (Physical)", "Falcon Fruit (Physical)", "Flame Fruit (Physical)", "Rocket Fruit (Physical)", "Spin Fruit (Physical)", "Chop Fruit (Physical)", "Spring Fruit (Physical)", "Bomb Fruit (Physical)", "Smoke Fruit (Physical)", "Spike Fruit (Physical)", "Dark Blade Gamepass Box", "Fruit Notifier Pass Box", "+1 Storage Capacity Pass", "2x Money Pass", "2x Mastery Pass", "Fast Boats Pass", "Permanent Kitsune Fruit", "Permanent Dragon Fruit", "Permanent Leopard Fruit", "Permanent Dough Fruit", "Permanent Buddha Fruit", "Permanent Portal Fruit"], fields: { worth: "Counter Offer Expectation", kg: false, mutation: false } }
        };

        const verifiedEmails = ["testunkown42@gmail.com", "l88635807@gmail.com", "devxdragon3@gmail.com"];
        const verifiedLogoUrl = "https://cdn.discordapp.com/attachments/1501911631708422215/1519654119353221210/1000030631.png?ex=6a3e57af&is=6a3d062f&hm=f5e27828d282be493d90fa81a93cca58b760a643b459d5b8f54fbf17a0536254&";

        let trades = [];
        let inbox = [];
        let currentUser = localStorage.getItem('roblox_user_email') || "";
        let editingListingId = null;

        window.openModal = function(id) { document.getElementById(id).style.display = 'flex'; };
        window.closeModal = function(id) { document.getElementById(id).style.display = 'none'; };

        window.switchTab = function(tab) {
            document.getElementById('uploadSection').classList.add('hidden');
            document.getElementById('feedSection').classList.add('hidden');
            document.getElementById('inboxSection').classList.add('hidden');
            
            document.getElementById('uploadTab').classList.remove('active');
            document.getElementById('viewTab').classList.remove('active');
            document.getElementById('inboxTab').classList.remove('active');

            if(tab === 'upload') {
                if(!currentUser) {
                    alert("Unauthorized Access: Complete verification portal setup via your Email structure first!");
                    window.openModal('loginModal');
                    return;
                }
                editingListingId = null;
                document.getElementById('uploadFormHeader').textContent = "Post Trade Item";
                document.getElementById('formSubmitBtn').textContent = "Post Item Details";
                document.getElementById('uploadForm').reset();
                document.getElementById('imageDataUrl').value = "";
                window.updateFormFields();
                document.getElementById('uploadSection').classList.remove('hidden');
                document.getElementById('uploadTab').classList.add('active');
            } else if (tab === 'inbox') {
                if(!currentUser) {
                    alert("Unauthorized Access: Complete verification portal setup via your Email structure first!");
                    window.openModal('loginModal');
                    return;
                }
                document.getElementById('inboxSection').classList.remove('hidden');
                document.getElementById('inboxTab').classList.add('active');
                window.renderInbox();
            } else {
                document.getElementById('feedSection').classList.remove('hidden');
                document.getElementById('viewTab').classList.add('active');
                window.renderItems();
            }
        };

        window.login = function() {
            const emailInput = document.getElementById('authEmail').value.trim();
            if(emailInput && emailInput.includes('@')) {
                localStorage.setItem('roblox_user_email', emailInput);
                currentUser = emailInput;
                updateAuthUI();
                window.closeModal('loginModal');
                window.updateInboxBadge();
                window.switchTab('view');
            } else {
                alert("Please provide a valid comprehensive email formatting layout address.");
            }
        };

        window.logout = function() {
            localStorage.removeItem('roblox_user_email');
            currentUser = "";
            updateAuthUI();
            window.switchTab('view');
            window.updateInboxBadge();
            window.renderItems();
        };

        function getCreatorLabelHtml(email) {
            if(!email) return "Unknown Trader";
            const cleanEmail = email.toLowerCase().trim();
            if(verifiedEmails.includes(cleanEmail)) {
                return `<strong>${email}</strong> <img src="${verifiedLogoUrl}" class="verified-badge" title="Verified Creator Account Platform Member">`;
            }
            return `<strong>${email}</strong>`;
        }

        function updateAuthUI() {
            const greeting = document.getElementById('userGreeting');
            const loginBtn = document.getElementById('loginBtn');
            const logoutBtn = document.getElementById('logoutBtn');
            const uploadIdentityInput = document.getElementById('formUserIdentity');

            if(currentUser) {
                greeting.innerHTML = `Session Account: ${getCreatorLabelHtml(currentUser)}`;
                loginBtn.classList.add('hidden');
                logoutBtn.classList.remove('hidden');
                uploadIdentityInput.value = currentUser; 
            } else {
                greeting.textContent = "";
                loginBtn.classList.remove('hidden');
                logoutBtn.classList.add('hidden');
                uploadIdentityInput.value = "";
            }
        }

        window.updateFormFields = function() {
            const selectedGame = document.getElementById('formGameType').value;
            const config = gameItemsDatabase[selectedGame];
            
            document.getElementById('labelWorth').textContent = config.fields.worth + ":";
            document.getElementById('fieldWorth').style.display = config.fields.worth ? 'block' : 'none';
            document.getElementById('fieldKg').style.display = config.fields.kg ? 'block' : 'none';
            document.getElementById('fieldMutation').style.display = config.fields.mutation ? 'block' : 'none';

            const itemDropdown = document.getElementById('formItemName');
            itemDropdown.innerHTML = "";
            
            config.items.forEach(item => {
                let opt = document.createElement('option');
                opt.value = item;
                opt.textContent = item;
                itemDropdown.appendChild(opt);
            });

            let customOpt = document.createElement('option');
            customOpt.value = "CUSTOM_ITEM_VAL";
            customOpt.textContent = "➕ Other / Custom Item (Type custom name below)";
            itemDropdown.appendChild(customOpt);

            window.checkCustomItem();
        };

        window.checkCustomItem = function() {
            const dropdown = document.getElementById('formItemName');
            const customItemField = document.getElementById('fieldCustomItem');
            const customInput = document.getElementById('formCustomItemName');

            if(dropdown.value === "CUSTOM_ITEM_VAL") {
                customItemField.classList.remove('hidden');
                customInput.required = true;
            } else {
                customItemField.classList.add('hidden');
                customInput.required = false;
                customInput.value = "";
            }
        };

        window.previewImage = function(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e){
                document.getElementById('imageDataUrl').value = e.target.result;
            }
            reader.readAsDataURL(file);
        };

        onValue(ref(db, 'trades'), (snapshot) => {
            const data = snapshot.val();
            if (data) {
                trades = Object.keys(data).map(key => {
                    return { id: key, ...data[key] };
                }).reverse();
            } else {
                trades = [];
            }
            window.renderItems();
        });

        onValue(ref(db, 'inbox'), (snapshot) => {
            const data = snapshot.val();
            if (data) {
                inbox = Object.keys(data).map(key => {
                    return { id: key, ...data[key] };
                }).reverse();
            } else {
                inbox = [];
            }
            window.updateInboxBadge();
            if (!document.getElementById('inboxSection').classList.contains('hidden')) {
                window.renderInbox();
            }
        });

        window.handleUpload = function(e) {
            e.preventDefault();
            if(!currentUser) {
                alert("Verification identity layout mismatch error.");
                return;
            }

            const game = document.getElementById('formGameType').value;
            let name = document.getElementById('formItemName').value;
            
            if(name === "CUSTOM_ITEM_VAL") {
                name = document.getElementById('formCustomItemName').value.trim();
                if(!name) {
                    alert("Please specify custom item name text metrics.");
                    return;
                }
            }

            const stockCount = parseInt(document.getElementById('formStock').value) || 1;
            let imageStr = document.getElementById('imageDataUrl').value;
            
            if (!imageStr) {
                if (editingListingId) {
                    const originalItem = trades.find(t => t.id === editingListingId);
                    imageStr = originalItem ? originalItem.image : "📦";
                } else {
                    imageStr = "📦";
                }
            }

            const worth = document.getElementById('formWorth').value.trim();
            const kg = document.getElementById('formKg').value.trim();
            const mutation = document.getElementById('formMutation').value.trim();
            const psLink = document.getElementById('formPsLink').value;

            const targetPayload = {
                creator: currentUser,
                game: game,
                name: name,
                stock: stockCount,
                image: imageStr,
                worth: worth || "None",
                kg: kg || "N/A->Seed",
                mutation: mutation || "N/A->Seed",
                psLink: psLink || "",
                timestamp: Date.now()
            };

            if (editingListingId) {
                const existingItem = trades.find(t => t.id === editingListingId);
                targetPayload.likes = existingItem ? (existingItem.likes || 0) : 0;
                
                if (existingItem && existingItem.likedBy) targetPayload.likedBy = existingItem.likedBy;
                if (existingItem && existingItem.comments) targetPayload.comments = existingItem.comments;

                update(ref(db, `trades/${editingListingId}`), targetPayload)
                    .then(() => {
                        finalizeReset();
                        alert("Item Successfully Updated!");
                    }).catch(err => alert("Sync Failed: " + err.message));
            } else {
                targetPayload.likes = 0;

                push(ref(db, 'trades'), targetPayload)
                    .then(() => {
                        finalizeReset();
                        alert("Item Successfully Uploaded to Firebase!");
                    }).catch(err => alert("Upload Failed: " + err.message));
            }

            function finalizeReset() {
                editingListingId = null;
                document.getElementById('uploadForm').reset();
                document.getElementById('imageDataUrl').value = "";
                window.switchTab('view');
            }
        };

        window.startEditListing = function(itemId) {
            const item = trades.find(t => t.id === itemId);
            if (!item) return;

            editingListingId = itemId;
            window.switchTab('upload');
            
            document.getElementById('uploadFormHeader').textContent = "Modify Trade Item Metrics";
            document.getElementById('formSubmitBtn').textContent = "Save Changes & Apply Updates";

            document.getElementById('formGameType').value = item.game;
            window.updateFormFields();

            const itemDropdown = document.getElementById('formItemName');
            const config = gameItemsDatabase[item.game];
            if (config && config.items.includes(item.name)) {
                itemDropdown.value = item.name;
            } else {
                itemDropdown.value = "CUSTOM_ITEM_VAL";
                window.checkCustomItem();
                document.getElementById('formCustomItemName').value = item.name;
            }

            document.getElementById('formStock').value = item.stock;
            document.getElementById('imageDataUrl').value = (item.image && item.image.startsWith('data:')) ? item.image : "";
            document.getElementById('formWorth').value = item.worth === "None" ? "" : (item.worth || "");
            document.getElementById('formKg').value = item.kg === "N/A->Seed" ? "" : (item.kg || "");
            document.getElementById('formMutation').value = item.mutation === "N/A->Seed" ? "" : (item.mutation || "");
            document.getElementById('formPsLink').value = item.psLink || "";
        };

        window.deleteListing = function(itemId) {
            if (!confirm("Are you completely sure you want to remove this transaction block from Firebase logs permanently?")) return;
            remove(ref(db, `trades/${itemId}`))
                .catch(err => alert("Error deleting: " + err.message));
        };

        window.toggleLike = function(itemId) {
            if(!currentUser) {
                alert("Login required to interact with listings.");
                return;
            }
            const item = trades.find(t => t.id === itemId);
            if(item) {
                let likedByArray = item.likedBy ? Object.values(item.likedBy) : [];
                let likesCount = item.likes || 0;
                const index = likedByArray.indexOf(currentUser);

                if(index === -1) {
                    likedByArray.push(currentUser);
                    likesCount += 1;
                } else {
                    likedByArray.splice(index, 1);
                    likesCount = Math.max(0, likesCount - 1);
                }

                update(ref(db, `trades/${itemId}`), {
                    likes: likesCount,
                    likedBy: likedByArray.length > 0 ? likedByArray : null
                });
            }
        };

        window.submitComment = function(e, itemId) {
            e.preventDefault();
            if(!currentUser) {
                alert("Login required to submit messages.");
                return;
            }
            const input = document.getElementById(`commentInput-${itemId}`);
            const text = input.value.trim();
            if(!text) return;

            const item = trades.find(t => t.id === itemId);
            if(item) {
                let commentsArray = item.comments ? Object.values(item.comments) : [];
                commentsArray.push({
                    user: currentUser,
                    text: text,
                    timestamp: new Date().toLocaleTimeString()
                });

                update(ref(db, `trades/${itemId}`), { comments: commentsArray })
                    .then(() => { input.value = ""; });
            }
        };

        window.sendTradeRequest = function(itemId) {
            if(!currentUser) {
                alert("Log in to send trade offers.");
                window.openModal('loginModal');
                return;
            }
            const item = trades.find(t => t.id === itemId);
            if(!item) return;

            if(item.creator.toLowerCase().trim() === currentUser.toLowerCase().trim()) {
                alert("You cannot trade with yourself.");
                return;
            }

            const newOffer = {
                itemId: item.id,
                itemName: item.name,
                to: item.creator,
                from: currentUser,
                status: 'pending',
                timestamp: Date.now()
            };

            push(ref(db, 'inbox'), newOffer)
                .then(() => alert(`Trade offer sent directly to ${item.creator}'s inbox!`));
        };

        window.processTradeOffer = function(offerId, action) {
            const offer = inbox.find(i => i.id === offerId);
            if(!offer) return;

            if(action === 'accept') {
                const item = trades.find(t => t.id === offer.itemId);
                if(!item) {
                    alert("Item no longer exists on the database network.");
                    update(ref(db, `inbox/${offerId}`), { status: 'expired' });
                } else if((item.stock || 0) <= 0) {
                    alert("Transaction failed: This item has no stock available!");
                    update(ref(db, `inbox/${offerId}`), { status: 'out-of-stock' });
                } else {
                    const finalStock = item.stock - 1;
                    update(ref(db, `trades/${offer.itemId}`), { stock: finalStock })
                        .then(() => {
                            update(ref(db, `inbox/${offerId}`), { status: 'accepted' });
                            alert(`Trade Accepted! Stock updated successfully.`);
                        });
                }
            } else {
                update(ref(db, `inbox/${offerId}`), { status: 'declined' })
                    .then(() => alert("Trade request declined."));
            }
        };

        window.updateInboxBadge = function() {
            if(!currentUser) {
                document.getElementById('inboxBadge').textContent = "";
                return;
            }
            const pendingCount = inbox.filter(i => i.to && i.to.toLowerCase().trim() === currentUser.toLowerCase().trim() && i.status === 'pending').length;
            document.getElementById('inboxBadge').textContent = pendingCount > 0 ? `(${pendingCount})` : "";
        };

        window.renderInbox = function() {
            const container = document.getElementById('inboxGrid');
            container.innerHTML = "";
            
            const userOffers = inbox.filter(i => i.to && i.to.toLowerCase().trim() === currentUser.toLowerCase().trim());

            if(userOffers.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding: 40px; color: var(--text-muted);">Your messaging inbox is currently empty.</div>`;
                return;
            }

            userOffers.forEach(offer => {
                const card = document.createElement('div');
                card.className = 'inbox-card';
                
                if(offer.status === 'pending') {
                    card.innerHTML = `
                        <div style="font-size: 16px; line-height: 1.5;">
                            <strong>Incoming Trade Request for item:</strong> <span style="color: var(--accent-color); font-weight: bold;">${offer.itemName}</span><br>
                            <span style="color: #ddd;">Do you want to accept the Trade with ${offer.from}? Chat this user so you can easily Trade Each other!</span>
                        </div>
                        <div class="inbox-actions">
                            <button class="btn-accept" onclick="window.processTradeOffer('${offer.id}', 'accept')">Accept</button>
                            <button class="btn-decline" onclick="window.processTradeOffer('${offer.id}', 'decline')">Decline</button>
                        </div>
                    `;
                } else {
                    let statusColor = offer.status === 'accepted' ? 'var(--accept-color)' : 'var(--decline-color)';
                    card.innerHTML = `
                        <div style="font-size: 14px; color: var(--text-muted);">
                            Trade Request for <strong>${offer.itemName}</strong> from <strong>${offer.from}</strong> has been 
                            <span style="color: ${statusColor}; font-weight: bold; text-transform: uppercase;">${offer.status}</span>.
                        </div>
                    `;
                }
                container.appendChild(card);
            });
        };

        window.renderItems = function() {
            const container = document.getElementById('itemGrid');
            const filterValue = document.getElementById('gameFilter').value;
            const searchQuery = document.getElementById('userSearchBar').value.toLowerCase().trim();
            container.innerHTML = "";

            const filtered = trades.filter(post => {
                const matchesGame = (filterValue === 'All' || post.game === filterValue);
                const matchesSearch = post.creator && post.creator.toLowerCase().includes(searchQuery);
                return matchesGame && matchesSearch;
            });

            if(filtered.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding: 40px; color: var(--text-muted);">No active transactions found matching filters.</div>`;
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'item-card';

                let imgRender = (item.image && (item.image.startsWith('data:') || item.image.startsWith('http'))) 
                    ? `<img src="${item.image}" alt="item Image">` 
                    : `<span>${item.image || '📦'}</span>`;

                const itemLikes = item.likes || 0;
                const commentsArray = item.comments ? Object.values(item.comments) : [];
                const currentStock = item.stock !== undefined ? item.stock : 1;

                let commentItemsHtml = commentsArray.map(c => `
                    <div class="comment-item">
                        <span style="color: var(--accent-color); font-weight:bold;">${c.user ? c.user.split('@')[0] : 'Trader'}:</span> ${c.text}
                    </div>
                `).join('');

                const isOwner = currentUser && item.creator && item.creator.toLowerCase().trim() === currentUser.toLowerCase().trim();

                card.innerHTML = `
                    <div class="item-main-content">
                        <div class="item-image-container">${imgRender}</div>
                        <div class="item-details">
                            <span class="item-game-badge">${item.game}</span>
                            <div class="item-title">${item.name}</div>
                            <div class="item-stat">Posted By Trader: ${getCreatorLabelHtml(item.creator)}</div>
                            <div class="item-stat">Stock Remaining: <strong style="color: var(--accent-color);">${currentStock}</strong></div>
                            <div class="item-stat">Value Data: <strong>${item.worth || 'None'}</strong></div>
                            <div class="item-stat">Weight Metrics: <strong>${item.kg || 'N/A->Seed'}</strong></div>
                            <div class="item-stat">Trait Mutation: <strong>${item.mutation || 'N/A->Seed'}</strong></div>
                            ${item.psLink ? `<div style="margin-top: 5px;"><a href="${item.psLink}" target="_blank" class="ps-link">Join Private Server</a></div>` : ''}
                        </div>
                    </div>
                    
                    <div class="interaction-bar">
                        <button class="interact-btn" onclick="window.toggleLike('${item.id}')">👍 Like (${itemLikes})</button>
                        
                        ${currentUser && !isOwner && currentStock > 0 ? `
                            <button class="interact-btn trade-action-btn" onclick="window.sendTradeRequest('${item.id}')">🤝 Send Trade Offer</button>
                        ` : ''}

                        ${isOwner ? `
                            <button class="interact-btn" style="border-color: #ffaa00; color: #ffaa00; margin-left: auto;" onclick="window.startEditListing('${item.id}')">✏️ Edit</button>
                            <button class="interact-btn" style="border-color: var(--decline-color); color: var(--decline-color);" onclick="window.deleteListing('${item.id}')">🗑️ Delete</button>
                        ` : ''}
                        
                        ${currentStock <= 0 ? `
                            <span style="color: var(--decline-color); font-weight: bold; ${isOwner ? 'margin-left: 10px;' : 'margin-left: auto;'}">SOLD OUT</span>
                        ` : ''}
                    </div>

                    <div class="comments-section">
                        <form onsubmit="window.submitComment(event, '${item.id}')" class="comment-box">
                            <input type="text" id="commentInput-${item.id}" placeholder="Type community comment text..." required>
                            <button type="submit" class="interact-btn">Post</button>
                        </form>
                        <div class="comment-list">${commentItemsHtml || '<span style="color: var(--text-muted); font-size: 12px;">No comments posted yet.</span>'}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        };

        updateAuthUI();
        window.updateFormFields();
    </script>
</body>
</html>
