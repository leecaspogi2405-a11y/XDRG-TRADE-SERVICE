<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xdragon Data Cloud App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen font-sans">

    <!-- Auth View -->
    <div id="auth-screen" class="flex flex-col items-center justify-center min-h-screen p-4">
        <div class="bg-gray-800 p-8 rounded-xl shadow-2xl w-full max-w-md border border-gray-700">
            <h1 class="text-3xl font-bold text-center text-indigo-500 mb-6">Xdragon Cloud Sign In</h1>
            <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Gmail Address</label>
                    <input type="email" id="auth-email" required placeholder="user@gmail.com" class="w-full p-3 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Password</label>
                    <input type="password" id="auth-password" required placeholder="••••••••" class="w-full p-3 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:border-indigo-500">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 py-3 rounded-lg font-semibold transition">Sign Up / Sign In</button>
            </form>
        </div>
    </div>

    <!-- Navigation Bar -->
    <nav id="nav-bar" class="hidden bg-gray-800 border-b border-gray-700 p-4 flex justify-between items-center">
        <div class="text-xl font-bold text-indigo-400 cursor-pointer" onclick="showDashboard()">Xdragon Cloud</div>
        <div class="flex items-center space-x-4">
            <span id="user-display" class="text-sm text-gray-400"></span>
            <button onclick="handleSignOut()" class="text-sm bg-red-600 hover:bg-red-700 px-3 py-1 rounded">Sign Out</button>
        </div>
    </nav>

    <!-- Dashboard View -->
    <div id="dashboard-screen" class="hidden max-w-4xl mx-auto p-6 space-y-6">
        <div class="flex justify-between items-center">
            <h2 class="text-2xl font-bold">Cloud Files</h2>
            <div class="space-x-2">
                <button onclick="openScannerModal()" class="bg-emerald-600 hover:bg-emerald-700 px-4 py-2 rounded-lg font-semibold transition">📷 Xdragon Scanner</button>
                <button onclick="showCreateFileScreen()" class="bg-indigo-600 hover:bg-indigo-700 px-4 py-2 rounded-lg font-semibold transition">Create File 🗃️</button>
            </div>
        </div>

        <div id="files-list" class="grid gap-4 md:grid-cols-2">
            <!-- Files loaded dynamically -->
        </div>
    </div>

    <!-- Create File View -->
    <div id="create-file-screen" class="hidden max-w-md mx-auto p-6 mt-10">
        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 space-y-4">
            <h2 class="text-2xl font-bold text-center">Create New File</h2>
            <div>
                <label class="block text-sm font-medium mb-1">File name:</label>
                <input type="text" id="new-file-name" placeholder="Enter file name" class="w-full p-3 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Privacy:</label>
                <select id="new-file-privacy" class="w-full p-3 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:border-indigo-500">
                    <option value="public">Public</option>
                    <option value="private">Private</option>
                </select>
            </div>
            <div class="flex items-center space-x-3 pt-2">
                <input type="checkbox" id="new-file-powered" class="w-5 h-5 text-indigo-600 rounded focus:ring-0 cursor-pointer">
                <label for="new-file-powered" class="text-sm cursor-pointer select-none">Powered by Xdragon/Leecastrence</label>
            </div>
            <div class="flex justify-end space-x-2 pt-4">
                <button onclick="showDashboard()" class="bg-gray-600 hover:bg-gray-700 px-4 py-2 rounded-lg font-semibold">Cancel</button>
                <button onclick="handleCreateFileDone()" class="bg-indigo-600 hover:bg-indigo-700 px-6 py-2 rounded-lg font-semibold">Done</button>
            </div>
        </div>
    </div>

    <!-- File Details View -->
    <div id="file-detail-screen" class="hidden max-w-4xl mx-auto p-6 space-y-6">
        <div class="flex justify-between items-center bg-gray-800 p-4 rounded-xl border border-gray-700">
            <div>
                <h2 id="detail-file-title" class="text-2xl font-bold"></h2>
                <span id="detail-file-badge" class="text-xs px-2 py-1 rounded"></span>
                <p id="detail-file-powered" class="text-xs text-indigo-400 mt-1"></p>
            </div>
            <div class="flex space-x-2">
                <button onclick="openScannerModal()" class="bg-emerald-600 hover:bg-emerald-700 px-4 py-2 rounded-lg font-semibold transition">Xdragon Scanner</button>
                <button onclick="showDashboard()" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg font-semibold">Back</button>
            </div>
        </div>

        <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 flex space-x-2">
            <input type="text" id="new-person-name" placeholder="Enter person's name" class="flex-1 p-3 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none">
            <button onclick="handleAddName()" class="bg-indigo-600 hover:bg-indigo-700 px-6 py-2 rounded-lg font-semibold">+Name</button>
        </div>

        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700">
            <h3 class="text-lg font-bold mb-4">See files</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-gray-700 text-gray-400">
                            <th class="p-3">Name</th>
                            <th class="p-3">status</th>
                            <th class="p-3">show qr</th>
                        </tr>
                    </thead>
                    <tbody id="names-table-body">
                        <!-- Dynamic items -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- QR Code Display Modal -->
    <div id="qr-modal" class="hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center p-4 z-50">
        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 max-w-sm w-full text-center space-y-4">
            <h3 id="qr-modal-title" class="text-xl font-bold"></h3>
            
            <div class="flex flex-col items-center justify-center bg-white p-4 rounded-lg">
                <canvas id="qr-canvas" class="max-w-full h-auto"></canvas>
            </div>

            <div class="flex space-x-2">
                <button onclick="downloadQrCode()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 py-2 rounded-lg font-semibold text-sm">Download QR</button>
                <button onclick="closeQrModal()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 py-2 rounded-lg font-semibold text-sm">Close</button>
            </div>
        </div>
    </div>

    <!-- Xdragon QR Scanner Modal -->
    <div id="scanner-modal" class="hidden fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center p-4 z-50">
        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 max-w-md w-full space-y-4">
            <h3 class="text-xl font-bold text-center">Xdragon Scanner</h3>
            <div>
                <label class="block text-sm font-medium mb-1">Select Name:</label>
                <select id="scanner-name-select" class="w-full p-3 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none">
                    <!-- Dynamic select -->
                </select>
            </div>
            
            <div id="reader" class="bg-black rounded-lg overflow-hidden min-h-[220px]"></div>

            <div class="text-center pt-2">
                <p class="text-xs text-gray-400 mb-2">Upload QR Image / Screenshot:</p>
                <input type="file" id="qr-input-file" accept="image/*" class="text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-700 cursor-pointer">
            </div>

            <div id="scan-result" class="text-center font-semibold min-h-[24px]"></div>
            <button onclick="closeScannerModal()" class="w-full bg-gray-600 hover:bg-gray-700 py-2 rounded-lg font-semibold">Cancel</button>
        </div>
    </div>

    <script>
        const LOGO_URL = "https://cdn.discordapp.com/attachments/1515213930870472724/1533378787927003176/FB_IMG_1785656304433.jpg?ex=6a7045c7&is=6a6ef447&hm=3e078452ab8ed3b506a57b309fba0e9ba044708e59cc8aba14771f51c9413a88&";
        let currentUser = null;
        let filesData = [];
        let activeFileId = null;
        let html5QrCode = null;

        window.onload = function() {
            loadCloudData();
            checkSession();

            document.getElementById('qr-input-file').addEventListener('change', e => {
                if (e.target.files.length === 0) return;
                const imageFile = e.target.files[0];
                if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
                html5QrCode.scanFile(imageFile, true)
                    .then(decodedText => onScanSuccess(decodedText))
                    .catch(err => {
                        const resultDiv = document.getElementById('scan-result');
                        resultDiv.className = "text-center font-semibold text-red-400";
                        resultDiv.innerText = "Error reading QR code image. Ensure QR pixels are clear.";
                    });
            });
        };

        function saveCloudData() {
            localStorage.setItem('xdragon_files_cloud', JSON.stringify(filesData));
            if (currentUser) {
                localStorage.setItem('xdragon_session', currentUser);
            }
        }

        function loadCloudData() {
            const data = localStorage.getItem('xdragon_files_cloud');
            filesData = data ? JSON.parse(data) : [];
        }

        function checkSession() {
            const savedUser = localStorage.getItem('xdragon_session');
            if (savedUser) {
                currentUser = savedUser;
                showMainLayout();
                showDashboard();
            } else {
                hideAllScreens();
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('nav-bar').classList.add('hidden');
            }
        }

        function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            if (email) {
                currentUser = email;
                saveCloudData();
                showMainLayout();
                showDashboard();
            }
        }

        function handleSignOut() {
            currentUser = null;
            localStorage.removeItem('xdragon_session');
            checkSession();
        }

        function showMainLayout() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('nav-bar').classList.remove('hidden');
            document.getElementById('user-display').innerText = currentUser;
        }

        function hideAllScreens() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('dashboard-screen').classList.add('hidden');
            document.getElementById('create-file-screen').classList.add('hidden');
            document.getElementById('file-detail-screen').classList.add('hidden');
        }

        function showDashboard() {
            hideAllScreens();
            document.getElementById('dashboard-screen').classList.remove('hidden');
            renderDashboard();
        }

        function renderDashboard() {
            const container = document.getElementById('files-list');
            container.innerHTML = '';

            const visibleFiles = filesData.filter(file => file.privacy === 'public' || file.owner === currentUser);

            if (visibleFiles.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center text-gray-500 py-8">No files available. Create one!</div>';
                return;
            }

            visibleFiles.forEach(file => {
                const card = document.createElement('div');
                card.className = 'bg-gray-800 p-5 rounded-xl border border-gray-700 hover:border-indigo-500 transition cursor-pointer flex flex-col justify-between';
                card.onclick = () => openFileDetails(file.id);

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="text-xl font-bold text-white">${file.name}</h3>
                            <span class="text-xs px-2 py-1 rounded ${file.privacy === 'public' ? 'bg-green-900 text-green-300' : 'bg-red-900 text-red-300'}">
                                ${file.privacy.toUpperCase()}
                            </span>
                        </div>
                        ${file.poweredBy ? '<p class="text-xs text-indigo-400 font-medium">Powered by Xdragon/Leecastrence</p>' : ''}
                    </div>
                    <div class="mt-4 text-sm text-gray-400 flex justify-between items-center">
                        <span>Items: ${file.names.length}</span>
                        <span class="text-indigo-400 font-semibold">View File →</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function showCreateFileScreen() {
            hideAllScreens();
            document.getElementById('new-file-name').value = '';
            document.getElementById('new-file-privacy').value = 'public';
            document.getElementById('new-file-powered').checked = false;
            document.getElementById('create-file-screen').classList.remove('hidden');
        }

        function handleCreateFileDone() {
            const name = document.getElementById('new-file-name').value.trim();
            const privacy = document.getElementById('new-file-privacy').value;
            const poweredBy = document.getElementById('new-file-powered').checked;

            if (!name) return;

            const newFile = {
                id: 'file_' + Date.now(),
                name: name,
                privacy: privacy,
                poweredBy: poweredBy,
                owner: currentUser,
                names: []
            };

            filesData.push(newFile);
            saveCloudData();
            openFileDetails(newFile.id);
        }

        function openFileDetails(fileId) {
            activeFileId = fileId;
            const file = filesData.find(f => f.id === fileId);
            if (!file) return;

            hideAllScreens();
            document.getElementById('file-detail-screen').classList.remove('hidden');

            document.getElementById('detail-file-title').innerText = file.name;
            const badge = document.getElementById('detail-file-badge');
            badge.innerText = file.privacy.toUpperCase();
            badge.className = `text-xs px-2 py-1 rounded ${file.privacy === 'public' ? 'bg-green-900 text-green-300' : 'bg-red-900 text-red-300'}`;
            document.getElementById('detail-file-powered').innerText = file.poweredBy ? 'Powered by Xdragon/Leecastrence' : '';

            renderNamesTable();
        }

        function handleAddName() {
            const nameInput = document.getElementById('new-person-name');
            const name = nameInput.value.trim();
            if (!name || !activeFileId) return;

            const file = filesData.find(f => f.id === activeFileId);
            if (file) {
                const uniqueToken = `XDRAGON_${file.id}_${Date.now()}_${Math.random().toString(36).substring(2, 7)}`;
                file.names.push({
                    id: 'person_' + Date.now(),
                    name: name,
                    status: false,
                    qrToken: uniqueToken
                });
                saveCloudData();
                nameInput.value = '';
                renderNamesTable();
            }
        }

        function renderNamesTable() {
            const tbody = document.getElementById('names-table-body');
            tbody.innerHTML = '';
            const file = filesData.find(f => f.id === activeFileId);
            if (!file) return;

            file.names.forEach(person => {
                const tr = document.createElement('tr');
                tr.className = 'border-b border-gray-700 hover:bg-gray-750';
                tr.innerHTML = `
                    <td class="p-3 font-medium">${person.name}</td>
                    <td class="p-3 text-lg">${person.status ? '✅' : '❎'}</td>
                    <td class="p-3">
                        <button onclick="showQrModal('${person.id}')" class="bg-indigo-600 hover:bg-indigo-700 px-3 py-1 rounded text-sm">custom qr</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function showQrModal(personId) {
            const file = filesData.find(f => f.id === activeFileId);
            if (!file) return;
            const person = file.names.find(p => p.id === personId);
            if (!person) return;

            document.getElementById('qr-modal-title').innerText = person.name;

            const canvas = document.getElementById('qr-canvas');
            const ctx = canvas.getContext('2d');

            // Canvas Dimensions (Width 280, Height 320 para kasya ang name sa ibaba)
            canvas.width = 280;
            canvas.height = 320;

            // Background Fill
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Temporary Canvas for QR Generation
            const tempCanvas = document.createElement('canvas');
            new QRious({
                element: tempCanvas,
                value: person.qrToken,
                size: 260,
                level: 'H'
            });

            // Draw QR onto main Canvas
            ctx.drawImage(tempCanvas, 10, 10);

            // Draw Center Logo
            const img = new Image();
            img.crossOrigin = 'Anonymous';
            img.onload = function() {
                const logoSize = 52;
                const x = 10 + (260 - logoSize) / 2;
                const y = 10 + (260 - logoSize) / 2;
                
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(x - 3, y - 3, logoSize + 6, logoSize + 6);
                ctx.drawImage(img, x, y, logoSize, logoSize);

                // Draw Person Name Below QR Code on Canvas
                ctx.fillStyle = '#0F172A';
                ctx.font = 'bold 18px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(person.name, canvas.width / 2, 295);
            };
            img.src = LOGO_URL;

            document.getElementById('qr-modal').classList.remove('hidden');
        }

        function downloadQrCode() {
            const canvas = document.getElementById('qr-canvas');
            const link = document.createElement('a');
            link.download = `${document.getElementById('qr-modal-title').innerText}_QR.png`;
            link.href = canvas.toDataURL();
            link.click();
        }

        function closeQrModal() {
            document.getElementById('qr-modal').classList.add('hidden');
        }

        function openScannerModal() {
            const select = document.getElementById('scanner-name-select');
            select.innerHTML = '';

            let availableNames = [];
            filesData.forEach(file => {
                if (file.privacy === 'public' || file.owner === currentUser) {
                    file.names.forEach(p => {
                        availableNames.push({ fileId: file.id, personId: p.id, name: p.name, fileName: file.name, qrToken: p.qrToken });
                    });
                }
            });

            if (availableNames.length === 0) {
                alert('No names available to scan.');
                return;
            }

            availableNames.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item.qrToken;
                opt.innerText = `${item.name} (${item.fileName})`;
                select.appendChild(opt);
            });

            document.getElementById('scan-result').innerText = '';
            document.getElementById('scanner-modal').classList.remove('hidden');

            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 200, height: 200 } },
                onScanSuccess
            ).catch(err => {
                document.getElementById('scan-result').innerText = 'Camera unavailable. Upload QR image instead.';
            });
        }

        function onScanSuccess(decodedText) {
            const selectedToken = document.getElementById('scanner-name-select').value;
            const resultDiv = document.getElementById('scan-result');

            if (decodedText === selectedToken) {
                resultDiv.className = "text-center font-semibold text-green-400";
                resultDiv.innerText = "Scan Successful! Status updated ✅";

                filesData.forEach(file => {
                    file.names.forEach(person => {
                        if (person.qrToken === decodedText) {
                            person.status = true;
                        }
                    });
                });

                saveCloudData();
                if (activeFileId) renderNamesTable();

                setTimeout(() => {
                    closeScannerModal();
                }, 1500);
            } else {
                resultDiv.className = "text-center font-semibold text-red-400";
                resultDiv.innerText = "QR mismatch! Please scan correct QR.";
            }
        }

        async function closeScannerModal() {
            // Agad na i-hide ang modal para guaranteed ang pagsasara
            document.getElementById('scanner-modal').classList.add('hidden');
            
            if (html5QrCode) {
                try {
                    if (html5QrCode.isScanning) {
                        await html5QrCode.stop();
                    }
                    html5QrCode.clear();
                } catch (err) {
                    console.log("Scanner cleanup handled");
                }
            }
        }
    </script>
</body>
</html>
