<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Xdrg Pilot Service • TikTok style</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --bg: #0a0a0a;
            --card: #1a1a1a;
            --text: #f5f5f5;
            --text-secondary: #aaa;
            --accent: #ff2a6d;
            --accent2: #00e5ff;
            --gold: #ffb300;
            --green: #00c853;
            --red: #ff1744;
            --border: #2c2c2c;
        }
        body {
            background: #000;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        #app {
            width: 100%;
            max-width: 480px;
            background: #0d0d0d;
            border-radius: 32px;
            overflow: hidden;
            border: 1px solid #2a2a2a;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            position: relative;
            display: flex;
            flex-direction: column;
            min-height: 85vh;
            max-height: 95vh;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 20px 10px;
            background: #0f0f0f;
            border-bottom: 1px solid var(--border);
        }
        .inbox-btn, .settings-btn {
            background: #1e1e1e;
            border: none;
            color: white;
            font-size: 1.2rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.1s;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .inbox-btn:active, .settings-btn:active {
            transform: scale(0.90);
        }
        .badge-dot {
            position: absolute;
            top: 0;
            right: 0;
            width: 10px;
            height: 10px;
            background: var(--accent);
            border-radius: 50%;
            display: none;
        }
        .lang-selector {
            display: flex;
            gap: 8px;
            padding: 12px 20px;
            justify-content: flex-end;
        }
        .lang-btn {
            background: transparent;
            border: 1px solid #444;
            color: #aaa;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.1s;
        }
        .lang-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
            font-weight: 600;
        }
        .screen {
            padding: 0 20px 20px;
            flex: 1;
            overflow-y: auto;
        }
        .hidden {
            display: none !important;
        }
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 24px 20px;
            margin-bottom: 16px;
            border: 1px solid #2c2c2c;
        }
        input {
            width: 100%;
            background: #222;
            border: 1px solid #3d3d3d;
            color: white;
            padding: 14px 16px;
            border-radius: 16px;
            font-size: 1rem;
            margin-bottom: 12px;
            outline: none;
            transition: 0.1s;
            -webkit-appearance: none;
        }
        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(255,42,109,0.2);
        }
        input[readonly] {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-primary {
            background: var(--accent);
            border: none;
            color: white;
            padding: 16px 24px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1.1rem;
            width: 100%;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 8px 20px rgba(255,42,109,0.3);
            margin-top: 8px;
        }
        .btn-primary:active {
            transform: scale(0.96);
        }
        .btn-secondary {
            background: #222;
            border: 1.5px solid #444;
            color: white;
            padding: 12px 20px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: 0.1s;
            margin-top: 10px;
        }
        .btn-secondary:active {
            transform: scale(0.96);
        }
        .pilot-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 16px 0;
        }
        .pilot-option {
            background: #1e1e1e;
            border: 2px solid #3a3a3a;
            border-radius: 18px;
            padding: 16px 20px;
            cursor: pointer;
            transition: all 0.1s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-weight: 700;
            font-size: 1rem;
            user-select: none;
        }
        .pilot-option:active {
            transform: scale(0.97);
        }
        .pilot-option.selected {
            border-color: var(--accent);
            background: #2a1a22;
            box-shadow: 0 0 15px rgba(255,42,109,0.3);
        }
        .price-badge {
            background: #333;
            padding: 6px 14px;
            border-radius: 30px;
            font-weight: 700;
            color: var(--gold);
            font-size: 0.9rem;
        }
        .agree-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 16px 0;
            background: #1b1b1b;
            padding: 14px;
            border-radius: 20px;
        }
        .agree-check {
            width: 24px;
            height: 24px;
            accent-color: var(--accent);
            cursor: pointer;
        }
        .check-cross {
            display: flex;
            gap: 15px;
            margin: 15px 0;
        }
        .check-btn, .cross-btn {
            flex: 1;
            padding: 14px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            text-align: center;
            font-size: 1.1rem;
            transition: 0.1s;
        }
        .check-btn { background: #1e1e1e; color: var(--green); border: 2px solid var(--green); }
        .cross-btn { background: #1e1e1e; color: var(--red); border: 2px solid var(--red); }
        .check-btn.selected { background: var(--green); color: black; box-shadow: 0 0 15px rgba(0, 200, 83, 0.4); }
        .cross-btn.selected { background: var(--red); color: white; box-shadow: 0 0 15px rgba(255, 23, 68, 0.4); }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin: 25px 0 10px;
        }
        .social-icon {
            font-size: 1.5rem;
            color: white;
            background: #222;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            text-decoration: none;
        }
        .social-icon.facebook { color: #1877f2; }
        .social-icon.tiktok { color: #69c9d0; }
        .social-icon.youtube { color: #ff0000; }
        
        .auth-toggle {
            text-align: center;
            margin-top: 15px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            cursor: pointer;
        }
        .auth-toggle span {
            color: var(--accent);
            font-weight: 600;
            text-decoration: underline;
        }
        .inbox-container {
            background: #141414;
            border-radius: 24px;
            padding: 16px;
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
        }
        .message-bubble {
            background: #222;
            padding: 14px;
            border-radius: 16px;
            margin-bottom: 12px;
            border-left: 4px solid var(--accent);
        }
        .message-bubble.system {
            border-left: 4px solid var(--accent2);
            background: #1a252a;
        }
        .small-text {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .title-gradient {
            background: linear-gradient(135deg, #ff2a6d, #ff6a3d);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 1.8rem;
            margin-bottom: 8px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translate(-50%, 0);
            background: var(--red);
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            z-index: 10000;
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        .toast-success { background: var(--green); color: black; }
    </style>
</head>
<body>
<div id="app">
    <div class="top-bar hidden" id="topBar">
        <button class="inbox-btn" id="inboxBtn" title="Inbox">
            <i class="fas fa-inbox"></i>
            <span class="badge-dot" id="inboxBadge"></span>
        </button>
        <h2 style="font-weight:800; font-size: 1.2rem;">⚡Xdrg Pilot</h2>
        <button class="settings-btn" id="settingsBtn" title="Settings">
            <i class="fas fa-cog"></i>
        </button>
    </div>

    <div class="lang-selector">
        <button class="lang-btn active" data-lang="en">English</button>
        <button class="lang-btn" data-lang="tl">Tagalog</button>
    </div>

    <!-- AUTH SCREEN -->
    <div id="signinScreen" class="screen">
        <div class="card">
            <h2 class="title-gradient" id="authTitle">Sign In</h2>
            <p class="small-text" id="authSubtitle" style="margin-bottom: 20px;">Welcome back! Please login</p>
            
            <input type="text" id="loginName" placeholder="Full Name" style="display: none;" />
            <input type="text" id="loginUsername" placeholder="Username" />
            <input type="password" id="loginPassword" placeholder="Password" />
            
            <button class="btn-primary" id="authBtn">Sign In</button>
            
            <div class="auth-toggle" id="authToggle">
                <span id="toggleQuestion">Don't have an account?</span> <span id="toggleText">Register now</span>
            </div>
        </div>
        <div class="social-links">
            <a class="social-icon facebook" href="https://www.facebook.com/share/1BiViKpPbt/" target="_blank"><i class="fab fa-facebook-f"></i></a>
            <a class="social-icon tiktok" href="https://tiktok.com/@xdragon...1" target="_blank"><i class="fab fa-tiktok"></i></a>
            <a class="social-icon youtube" href="https://www.youtube.com/@dev-xdragon" target="_blank"><i class="fab fa-youtube"></i></a>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="mainScreen" class="screen hidden">
        <h2 class="title-gradient">Welcome, <span id="welcomeUser">Pilot</span> 👋</h2>
        <p class="small-text" style="margin-bottom:15px;">Select any Pilot set-up you want 👇</p>
        
        <div id="newMemberSection" class="hidden">
            <div class="card" style="background: #2a1a1a; border-color:#ff3b5c;">
                <h3 style="margin-bottom: 10px;">🔥 New Member Selection</h3>
                <div class="pilot-grid" id="newPilotGrid"></div>
            </div>
        </div>
        
        <div id="oldUserSection">
            <div class="card">
                <h3 style="margin-bottom: 10px;">🖥️ With 5min breaks / hr</h3>
                <div class="pilot-grid" id="breakPilotGrid"></div>
            </div>
            <div class="card">
                <h3 style="margin-bottom: 10px;">🤖 Without Break (Best)</h3>
                <div class="pilot-grid" id="nobreakPilotGrid"></div>
            </div>
        </div>

        <div class="agree-row">
            <input type="checkbox" id="agreeCheckbox" class="agree-check" />
            <span id="agreeLabel" style="font-size: 0.9rem; font-weight: 600;">Do you agree with Xdrg Pilot rules?</span>
        </div>
        <div class="check-cross">
            <button class="check-btn" id="agreeYes">✅ Yes</button>
            <button class="cross-btn" id="agreeNo">❎ No</button>
        </div>
        <button class="btn-primary" id="confirmPilotBtn" style="margin-top: 10px;">Confirm & Send to Owner</button>
    </div>

    <!-- INBOX SCREEN -->
    <div id="inboxScreen" class="screen hidden">
        <h3 style="margin-bottom: 15px;">📥 Inbox</h3>
        <div id="inboxMessages" class="inbox-container"></div>
        <button class="btn-secondary" id="backFromInbox">← Back to Dashboard</button>
    </div>

    <!-- SETTINGS SCREEN -->
    <div id="settingsScreen" class="screen hidden">
        <h3 style="margin-bottom: 15px;">⚙️ Settings & Profile</h3>
        <div class="card">
            <label>Name:</label>
            <input type="text" id="profileName" placeholder="Your name" />
            
            <label>Username:</label>
            <input type="text" id="profileUsername" readonly />
            
            <label>Payment Method Name:</label>
            <input type="text" id="paymentName" placeholder="e.g. GCash Name" />
            
            <label>Payment Number:</label>
            <input type="text" id="paymentNumber" placeholder="09xxxxxxxxx" />
            
            <label>Roblox Pilot Username:</label>
            <input type="text" id="pilotUsername" placeholder="Roblox username" />
            
            <label>Roblox Pilot Password:</label>
            <input type="password" id="pilotPassword" placeholder="Roblox password" />
            
            <button class="btn-primary" id="saveProfileBtn" style="background: var(--accent2); color: black;">💾 Save Profile</button>
            <button class="btn-secondary" id="logoutBtn" style="border-color: var(--red); color: var(--red); margin-top:20px;">🚪 Log Out</button>
        </div>
        <button class="btn-secondary" id="backFromSettings">← Back to Dashboard</button>
    </div>
</div>

<script>
    // TOAST SYSTEM
    function showToast(msg, type = 'error') {
        const existing = document.querySelector('.toast');
        if (existing) existing.remove();
        const toast = document.createElement('div');
        toast.className = `toast toast-${type}`;
        toast.innerText = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
    }

    // NON-BLOCKING SUPABASE INIT
    const SUPABASE_URL = "https://iitvkgptsaowlghxfuec.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlpdHZrZ3B0c2Fvd2xnaHhmdWVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0Njk4NjIsImV4cCI6MjEwMzA0NTg2Mn0.JRnDge3FS-DFJN_1AazUELHPcIr-wNEFBBGnKL2nCcw";
    let supabase = null;
    try {
        if (window.supabase) {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }
    } catch(e) { console.warn('Supabase offline or failed to load'); }

    // LOCAL-FIRST STATE
    let currentUser = null;
    try {
        const stored = localStorage.getItem('xdrg_user');
        if (stored) currentUser = JSON.parse(stored);
    } catch(e) { localStorage.removeItem('xdrg_user'); }

    let localMessages = JSON.parse(localStorage.getItem('xdrg_messages') || '[]');
    let selectedPilot = null;
    let agreeStatus = null;
    let isLoginMode = true;
    let currentLang = 'en';

    const translations = {
        en: {
            signInTitle: 'Sign In', registerTitle: 'Register',
            signInSub: 'Welcome back! Please login', registerSub: 'Create your new account',
            authBtnSignIn: 'Sign In', authBtnRegister: 'Register',
            toggleQuestion: "Don't have an account?", toggleTextRegister: "Register now",
            toggleQuestion2: "Already have an account?", toggleTextLogin: "Sign in",
            newMemberTitle: '🔥 New Member Selection',
            breakTitle: '🖥️ With 5min breaks every hour', nobreakTitle: '🤖 Without Break (Best Selection)',
            agreeText: 'Do you agree with Xdrg Pilot rules?', confirmBtn: 'Confirm & Send to Owner',
        },
        tl: {
            signInTitle: 'Mag-sign In', registerTitle: 'Magrehistro',
            signInSub: 'Maligayang pagbabalik! Mag-login', registerSub: 'Gumawa ng iyong account',
            authBtnSignIn: 'Mag-sign In', authBtnRegister: 'Magrehistro',
            toggleQuestion: "Walang account?", toggleTextRegister: "Magrehistro ngayon",
            toggleQuestion2: "May account na?", toggleTextLogin: "Mag-sign in",
            newMemberTitle: '🔥 Bagong Miyembro Promo',
            breakTitle: '🖥️ May 5 minutong pahinga/oras', nobreakTitle: '🤖 Walang Pahinga (Pinakamahusay)',
            agreeText: 'Sumasang-ayon ka ba sa patakaran ng Xdrg?', confirmBtn: 'Kumpirmahin at Ipadala',
        }
    };

    const newMemberPlans = [{ label: "30 Minute", price: "Free" }, { label: "2 Hour", price: "₱5" }, { label: "3 Hour", price: "₱12" }, { label: "4 Hour", price: "₱25" }, { label: "24 Hour", price: "₱899" }, { label: "24D/7H", price: "₱3499" }];
    const breakPlans = [{ label: "30 minute", price: "₱35" }, { label: "2 Hour", price: "₱110" }, { label: "3 Hour", price: "₱159" }, { label: "4 Hour", price: "₱229" }, { label: "24 Hour", price: "₱1100" }, { label: "24D/7H", price: "₱4299" }];
    const noBreakPlans = [{ label: "30 minute", price: "₱65" }, { label: "2 Hour", price: "₱128" }, { label: "3 Hour", price: "₱179" }, { label: "4 Hour", price: "₱249" }, { label: "24 Hour", price: "₱1299" }, { label: "24D/7H", price: "₱4599" }];

    function renderPilotGrid(containerId, plans, category) {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.innerHTML = '';
        plans.forEach(plan => {
            const button = document.createElement('div');
            button.className = 'pilot-option';
            button.innerHTML = `<span>${plan.label}</span><span class="price-badge">${plan.price}</span>`;
            button.addEventListener('click', function() {
                document.querySelectorAll('.pilot-option').forEach(btn => btn.classList.remove('selected'));
                this.classList.add('selected');
                selectedPilot = { category, label: plan.label, price: plan.price };
            });
            container.appendChild(button);
        });
    }

    function updateLanguage() {
        const lang = translations[currentLang];
        document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.lang === currentLang));
        
        if (isLoginMode) {
            document.getElementById('authTitle').textContent = lang.signInTitle;
            document.getElementById('authSubtitle').textContent = lang.signInSub;
            document.getElementById('authBtn').textContent = lang.authBtnSignIn;
            document.getElementById('toggleQuestion').textContent = lang.toggleQuestion;
            document.getElementById('toggleText').textContent = lang.toggleTextRegister;
            document.getElementById('loginName').style.display = 'none';
        } else {
            document.getElementById('authTitle').textContent = lang.registerTitle;
            document.getElementById('authSubtitle').textContent = lang.registerSub;
            document.getElementById('authBtn').textContent = lang.authBtnRegister;
            document.getElementById('toggleQuestion').textContent = lang.toggleQuestion2;
            document.getElementById('toggleText').textContent = lang.toggleTextLogin;
            document.getElementById('loginName').style.display = 'block';
        }
        if (currentUser) document.getElementById('welcomeUser').textContent = currentUser.name || 'Pilot';
        
        document.querySelector('#newMemberSection h3').textContent = lang.newMemberTitle;
        document.querySelector('#oldUserSection .card:nth-child(1) h3').textContent = lang.breakTitle;
        document.querySelector('#oldUserSection .card:nth-child(2) h3').textContent = lang.nobreakTitle;
        document.getElementById('agreeLabel').textContent = lang.agreeText;
        document.getElementById('confirmPilotBtn').textContent = lang.confirmBtn;
    }

    function showScreen(screen) {
        document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
        document.getElementById('topBar').classList.add('hidden');
        
        if (screen === 'main' && currentUser) {
            document.getElementById('topBar').classList.remove('hidden');
            document.getElementById('mainScreen').classList.remove('hidden');
            
            const createdAt = currentUser.created_at ? new Date(currentUser.created_at).getTime() : Date.now();
            const isNew = (Date.now() - createdAt) < 86400000;
            document.getElementById('newMemberSection').classList.toggle('hidden', !isNew);
            document.getElementById('oldUserSection').classList.toggle('hidden', isNew);
            document.getElementById('welcomeUser').textContent = currentUser.name || 'Pilot';
        } else if (screen === 'signin') {
            document.getElementById('signinScreen').classList.remove('hidden');
        } else if (screen === 'inbox') {
            document.getElementById('topBar').classList.remove('hidden');
            document.getElementById('inboxScreen').classList.remove('hidden');
            document.getElementById('inboxBadge').style.display = 'none';
            renderInbox();
        } else if (screen === 'settings') {
            document.getElementById('topBar').classList.remove('hidden');
            document.getElementById('settingsScreen').classList.remove('hidden');
            loadProfile();
        }
        updateLanguage();
    }

    // INSTANT LOCAL SAVE & ASYNC AUTH
    document.getElementById('authToggle').addEventListener('click', () => {
        isLoginMode = !isLoginMode;
        updateLanguage();
    });

    document.getElementById('authBtn').addEventListener('click', async () => {
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value.trim();
        const name = document.getElementById('loginName').value.trim();

        if (!username || !password || (!isLoginMode && !name)) {
            showToast('⚠️ Please enter all required fields.');
            return;
        }

        // INSTANT LOCAL ACCOUNT EXECUTION
        if (isLoginMode) {
            currentUser = { username, password, name: username, created_at: new Date().toISOString() };
            localStorage.setItem('xdrg_user', JSON.stringify(currentUser));
            showToast('✅ Logged in!', 'success');
            showScreen('main');

            // Background Supabase Sync (Non-blocking)
            if (supabase) {
                supabase.from('users').select('*').eq('username', username).maybeSingle().then(({ data }) => {
                    if (data) {
                        currentUser = data;
                        localStorage.setItem('xdrg_user', JSON.stringify(data));
                    }
                }).catch(() => {});
            }
        } else {
            currentUser = { username, password, name, created_at: new Date().toISOString() };
            localStorage.setItem('xdrg_user', JSON.stringify(currentUser));
            showToast('✅ Account Registered!', 'success');
            showScreen('main');

            // Background Register Sync (Non-blocking)
            if (supabase) {
                supabase.from('users').insert([{ name, username, password, created_at: currentUser.created_at }]).then(() => {}).catch(() => {});
            }
        }
    });

    // INSTANT AGREEMENT TOGGLE
    function setAgreement(status) {
        agreeStatus = status;
        const isYes = status === 'yes';
        document.getElementById('agreeCheckbox').checked = isYes;
        document.getElementById('agreeYes').classList.toggle('selected', isYes);
        document.getElementById('agreeNo').classList.toggle('selected', !isYes && status !== null);
    }
    document.getElementById('agreeYes').addEventListener('click', () => setAgreement('yes'));
    document.getElementById('agreeNo').addEventListener('click', () => setAgreement('no'));
    document.getElementById('agreeCheckbox').addEventListener('change', (e) => setAgreement(e.target.checked ? 'yes' : null));

    // INSTANT PILOT SELECTION & CONFIRM
    document.getElementById('confirmPilotBtn').addEventListener('click', () => {
        if (!selectedPilot) return showToast('⚠️ Select a Pilot plan first!');
        if (agreeStatus !== 'yes') return showToast('⚠️ You must agree to the rules!');

        const userMsg = {
            username: currentUser.username,
            message: `Pilot selected: ${selectedPilot.label} (${selectedPilot.price})`,
            created_at: new Date().toISOString()
        };
        const sysMsg = {
            username: currentUser.username,
            message: `🤖 SYSTEM: Your request (${selectedPilot.label}) is saved! We will start piloting shortly.`,
            created_at: new Date(Date.now() + 500).toISOString()
        };

        // Save Locally Instantly
        localMessages.unshift(sysMsg, userMsg);
        localStorage.setItem('xdrg_messages', JSON.stringify(localMessages));
        
        showToast('✅ Pilot sent successfully!', 'success');
        document.getElementById('inboxBadge').style.display = 'block';

        // Background Supabase Sync (Non-blocking)
        if (supabase) {
            supabase.from('pilot_messages').insert([{
                username: currentUser.username,
                pilot_selected: `${selectedPilot.label} - ${selectedPilot.price} (${selectedPilot.category})`,
                message: userMsg.message,
                owner_email: 'xdrgxdragon@gmail.com',
                created_at: userMsg.created_at
            }]).then(() => {}).catch(() => {});
        }

        selectedPilot = null;
        setAgreement(null);
        document.querySelectorAll('.pilot-option').forEach(b => b.classList.remove('selected'));
    });

    // INSTANT INBOX DISPLAY
    function renderInbox() {
        const container = document.getElementById('inboxMessages');
        if (localMessages.length === 0) {
            container.innerHTML = '<p class="small-text">No messages yet.</p>';
            return;
        }
        container.innerHTML = localMessages.map(msg => {
            const isSystem = msg.message.includes('🤖 SYSTEM:');
            return `
            <div class="message-bubble ${isSystem ? 'system' : ''}">
                <strong>${isSystem ? '⚙️ Admin System' : (currentUser ? currentUser.name : 'User')}</strong>
                <p style="margin: 6px 0;">${msg.message}</p>
                <span class="small-text">${new Date(msg.created_at).toLocaleString()}</span>
            </div>`;
        }).join('');
    }

    // INSTANT PROFILE SAVE
    function loadProfile() {
        if (!currentUser) return;
        document.getElementById('profileName').value = currentUser.name || '';
        document.getElementById('profileUsername').value = currentUser.username || '';
        document.getElementById('paymentName').value = currentUser.payment_name || '';
        document.getElementById('paymentNumber').value = currentUser.payment_number || '';
        document.getElementById('pilotUsername').value = currentUser.pilot_username || '';
        document.getElementById('pilotPassword').value = currentUser.pilot_password || '';
    }

    document.getElementById('saveProfileBtn').addEventListener('click', () => {
        const updates = {
            name: document.getElementById('profileName').value,
            payment_name: document.getElementById('paymentName').value,
            payment_number: document.getElementById('paymentNumber').value,
            pilot_username: document.getElementById('pilotUsername').value,
            pilot_password: document.getElementById('pilotPassword').value,
        };

        // SAVE LOCALLY IMMEDIATELY
        currentUser = { ...currentUser, ...updates };
        localStorage.setItem('xdrg_user', JSON.stringify(currentUser));
        showToast('💾 Profile saved locally!', 'success');

        // BACKGROUND SYNC TO SUPABASE
        if (supabase) {
            supabase.from('users').update(updates).eq('username', currentUser.username)
                .then(() => {})
                .catch(() => {});
        }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
        currentUser = null;
        localStorage.removeItem('xdrg_user');
        showScreen('signin');
    });

    // NAV LISTENERS
    document.getElementById('inboxBtn').addEventListener('click', () => showScreen('inbox'));
    document.getElementById('settingsBtn').addEventListener('click', () => showScreen('settings'));
    document.getElementById('backFromInbox').addEventListener('click', () => showScreen('main'));
    document.getElementById('backFromSettings').addEventListener('click', () => showScreen('main'));
    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            currentLang = this.dataset.lang;
            updateLanguage();
        });
    });

    // INIT GRIDS & SCREEN
    renderPilotGrid('newPilotGrid', newMemberPlans, 'new');
    renderPilotGrid('breakPilotGrid', breakPlans, 'break');
    renderPilotGrid('nobreakPilotGrid', noBreakPlans, 'nobreak');

    if (currentUser) {
        showScreen('main');
    } else {
        showScreen('signin');
    }
</script>
</body>
</html>
