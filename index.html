<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Xdrg Pilot Service • TikTok style</title>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Font Awesome for social icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        :root {
            --bg: #121212;
            --card: #1e1e1e;
            --card-hover: #2a2a2a;
            --text: #f1f1f1;
            --text-secondary: #b0b0b0;
            --accent: #ff2a6d;
            --accent2: #00e5ff;
            --green: #00c853;
            --red: #ff1744;
            --gold: #ffb300;
            --border: #333;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            transition: all 0.2s;
        }

        #app {
            width: 100%;
            max-width: 480px;
            background: #0d0d0d;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            overflow: hidden;
            position: relative;
            border: 1px solid #2a2a2a;
            padding-bottom: 20px;
        }

        /* header / inbox top */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 20px 10px;
        }
        .inbox-btn, .settings-btn {
            background: #222;
            border: none;
            color: white;
            font-size: 1.5rem;
            padding: 10px 14px;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }
        .inbox-btn:hover, .settings-btn:hover {
            background: #333;
        }
        .badge-dot {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 10px;
            height: 10px;
            background: var(--accent);
            border-radius: 50%;
            border: 2px solid #0d0d0d;
        }

        /* language selector */
        .lang-selector {
            display: flex;
            gap: 8px;
            padding: 0 20px 12px;
            justify-content: flex-end;
        }
        .lang-btn {
            background: transparent;
            border: 1px solid #444;
            color: #aaa;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .lang-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
            font-weight: 600;
        }

        /* screens */
        .screen {
            padding: 0 20px 20px;
        }
        .hidden {
            display: none !important;
        }

        h1, h2, h3 {
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .title-gradient {
            background: linear-gradient(135deg, #ff2a6d, #ff6a3d);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 24px 20px;
            margin-bottom: 20px;
            border: 1px solid #2c2c2c;
        }

        input, select {
            width: 100%;
            background: #2a2a2a;
            border: 1px solid #3d3d3d;
            color: white;
            padding: 14px 16px;
            border-radius: 16px;
            font-size: 1rem;
            margin-bottom: 12px;
            outline: none;
            transition: 0.2s;
        }
        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(255,42,109,0.2);
        }

        .btn-primary {
            background: var(--accent);
            border: none;
            color: white;
            padding: 16px 24px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1.1rem;
            width: 100%;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 8px 20px rgba(255,42,109,0.3);
            margin-top: 8px;
        }
        .btn-primary:hover {
            background: #ff4d7e;
            transform: scale(1.01);
        }

        .btn-secondary {
            background: transparent;
            border: 1.5px solid #555;
            color: white;
            padding: 12px 20px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }
        .btn-secondary:hover {
            background: #2a2a2a;
        }

        .pilot-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 16px 0;
        }
        .pilot-option {
            background: #1e1e1e;
            border: 1.5px solid #3a3a3a;
            border-radius: 18px;
            padding: 16px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1rem;
            font-weight: 600;
        }
        .pilot-option.selected {
            border-color: var(--accent);
            background: #2a1a22;
            box-shadow: 0 0 15px rgba(255,42,109,0.3);
        }
        .pilot-option:hover {
            background: #262626;
        }
        .price-badge {
            background: #333;
            padding: 6px 14px;
            border-radius: 30px;
            font-weight: 700;
            color: var(--gold);
        }

        .divider {
            height: 2px;
            background: #2c2c2c;
            margin: 20px 0;
            border-radius: 2px;
        }

        .agree-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 16px 0;
            background: #1b1b1b;
            padding: 14px;
            border-radius: 20px;
        }
        .agree-check {
            width: 24px;
            height: 24px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .check-cross {
            display: flex;
            gap: 15px;
            margin: 15px 0;
        }
        .check-btn, .cross-btn {
            flex: 1;
            padding: 14px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: 0.2s;
            text-align: center;
        }
        .check-btn { background: #00c853; color: black; }
        .cross-btn { background: #ff1744; color: white; }
        .check-btn.selected, .cross-btn.selected {
            box-shadow: 0 0 0 4px white, 0 0 20px currentColor;
            transform: scale(1.02);
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 28px;
            margin: 30px 0 10px;
        }
        .social-icon {
            font-size: 2.4rem;
            color: white;
            background: #222;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            text-decoration: none;
            transition: 0.2s;
        }
        .social-icon.facebook { color: #1877f2; }
        .social-icon.tiktok { color: #69c9d0; }
        .social-icon.youtube { color: #ff0000; }

        .inbox-container, .settings-container {
            background: #141414;
            border-radius: 24px;
            padding: 20px;
        }
        .message-bubble {
            background: #222;
            padding: 14px;
            border-radius: 16px;
            margin: 10px 0;
            border-left: 4px solid var(--accent);
        }
        .automation-message {
            background: #1a2a2a;
            border-left: 4px solid var(--accent2);
        }
        .small-text {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .save-btn {
            background: var(--accent2);
            color: black;
            font-weight: 700;
        }
    </style>
</head>
<body>
<div id="app">
    <!-- top bar inbox & settings -->
    <div class="top-bar">
        <button class="inbox-btn" id="inboxBtn" title="Inbox">📥 <span class="badge-dot" id="inboxBadge" style="display: none;"></span></button>
        <h2 style="font-weight:800;">⚡Xdrg Pilot</h2>
        <button class="settings-btn" id="settingsBtn" title="Settings">⚙️</button>
    </div>

    <!-- language -->
    <div class="lang-selector">
        <button class="lang-btn active" data-lang="en">English</button>
        <button class="lang-btn" data-lang="tl">Tagalog</button>
    </div>

    <!-- SCREENS -->
    <div id="signinScreen" class="screen">
        <div class="card">
            <h2 class="title-gradient">Sign in / Log in</h2>
            <input type="text" id="loginName" placeholder="Name (full name)" />
            <input type="text" id="loginUsername" placeholder="Username" />
            <input type="password" id="loginPassword" placeholder="Password" />
            <button class="btn-primary" id="loginBtn">Sign in / Log in</button>
            <p class="small-text" style="margin-top:10px; text-align:center;">New? Login automatically creates account.</p>
        </div>
        <div class="social-links">
            <a class="social-icon facebook" href="https://www.facebook.com/share/1BiViKpPbt/" target="_blank"><i class="fab fa-facebook-f"></i></a>
            <a class="social-icon tiktok" href="https://tiktok.com/@xdragon...1" target="_blank"><i class="fab fa-tiktok"></i></a>
            <a class="social-icon youtube" href="https://www.youtube.com/@dev-xdragon" target="_blank"><i class="fab fa-youtube"></i></a>
        </div>
    </div>

    <div id="mainScreen" class="screen hidden">
        <h2 class="title-gradient">Welcome, <span id="welcomeUser">Pilot</span> 👋</h2>
        <p class="small-text" style="margin-bottom:10px;">Select any Pilot set-up you want 👇</p>
        <!-- NEW vs OLD user toggle automatically by age of account -->
        <div id="newMemberSection" class="hidden">
            <div class="card" style="background: #2a1a1a; border-color:#ff3b5c;">
                <h3>🔥 New Member Selection</h3>
                <div class="pilot-grid" id="newPilotGrid"></div>
            </div>
        </div>
        <div id="oldUserSection">
            <div class="card">
                <h3>🖥️ With 5min breaks every hour</h3>
                <div class="pilot-grid" id="breakPilotGrid"></div>
            </div>
            <div class="card">
                <h3>🤖 Without Break (Best Selection)</h3>
                <div class="pilot-grid" id="nobreakPilotGrid"></div>
            </div>
        </div>

        <!-- agreement -->
        <div class="agree-row">
            <input type="checkbox" id="agreeCheckbox" class="agree-check" />
            <span>✅/❎ | [ ] Do you agree with Xdrg Pilot</span>
        </div>
        <div class="check-cross">
            <button class="check-btn" id="agreeYes">✅ Yes</button>
            <button class="cross-btn" id="agreeNo">❎ No</button>
        </div>
        <button class="btn-primary" id="confirmPilotBtn">Confirm & Send to Owner</button>
    </div>

    <div id="inboxScreen" class="screen hidden">
        <h3>📥 Inbox</h3>
        <div id="inboxMessages" class="inbox-container"></div>
        <button class="btn-secondary" id="backFromInbox">← Back</button>
    </div>

    <div id="settingsScreen" class="screen hidden">
        <h3>⚙️ Settings / Profile</h3>
        <div class="card">
            <label>Name:</label><input type="text" id="profileName" placeholder="Your name" />
            <label>Username:</label><input type="text" id="profileUsername" placeholder="Username" />
            <label>Payment Name:</label><input type="text" id="paymentName" placeholder="e.g. GCash name" />
            <label>Payment Number:</label><input type="text" id="paymentNumber" placeholder="09xxxxxxxxx" />
            <label>Pilot Username (Roblox):</label><input type="text" id="pilotUsername" placeholder="Roblox username" />
            <label>Pilot Password:</label><input type="password" id="pilotPassword" placeholder="Roblox password" />
            <button class="btn-primary save-btn" id="saveProfileBtn">💾 Save Profile</button>
        </div>
        <button class="btn-secondary" id="backFromSettings">← Back</button>
    </div>
</div>

<script>
    // SUPABASE CREDENTIALS (provided)
    const SUPABASE_URL = "https://iitvkgptsaowlghxfuec.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlpdHZrZ3B0c2Fvd2xnaHhmdWVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0Njk4NjIsImV4cCI6MjEwMzA0NTg2Mn0.JRnDge3FS-DFJN_1AazUELHPcIr-wNEFBBGnKL2nCcw";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Language strings
    const translations = {
        en: {
            welcome: "Welcome",
            newMemberTitle: "🔥 New Member Selection",
            breakTitle: "🖥️ With 5min breaks every hour",
            nobreakTitle: "🤖 Without Break (Best Selection)",
            agreeText: "Do you agree with Xdrg Pilot",
            confirmBtn: "Confirm & Send to Owner",
            inboxTitle: "📥 Inbox",
        },
        tl: {
            welcome: "Maligayang pagdating",
            newMemberTitle: "🔥 Bagong Miyembro",
            breakTitle: "🖥️ May 5 minutong pahinga kada oras",
            nobreakTitle: "🤖 Walang Pahinga (Pinakamahusay)",
            agreeText: "Sumasang-ayon ka ba sa Xdrg Pilot",
            confirmBtn: "Kumpirmahin at Ipadala sa May-ari",
            inboxTitle: "📥 Inbox",
        }
    };
    let currentLang = 'en';

    // PILOT DATA
    const newMemberPlans = [
        { label: "30 Minute", price: "Free" },
        { label: "2 Hour", price: "₱5" },
        { label: "3 Hour", price: "₱12" },
        { label: "4 Hour", price: "₱25" },
        { label: "24 Hour", price: "₱899" },
        { label: "24D/7H", price: "₱3499" }
    ];
    const breakPlans = [
        { label: "30 minute", price: "₱35" },
        { label: "2 Hour", price: "₱110" },
        { label: "3 Hour", price: "₱159" },
        { label: "4 Hour", price: "₱229" },
        { label: "24 Hour", price: "₱1100" },
        { label: "24D/7H", price: "₱4299" }
    ];
    const noBreakPlans = [
        { label: "30 minute", price: "₱65" },
        { label: "2 Hour", price: "₱128" },
        { label: "3 Hour", price: "₱179" },
        { label: "4 Hour", price: "₱249" },
        { label: "24 Hour", price: "₱1299" },
        { label: "24D/7H", price: "₱4599" }
    ];

    let currentUser = null; // { name, username, password, created_at }
    let selectedPilot = null;
    let agreeStatus = null; // 'yes' or 'no'

    // DOM elements
    const signinScreen = document.getElementById('signinScreen');
    const mainScreen = document.getElementById('mainScreen');
    const inboxScreen = document.getElementById('inboxScreen');
    const settingsScreen = document.getElementById('settingsScreen');
    const newMemberSection = document.getElementById('newMemberSection');
    const oldUserSection = document.getElementById('oldUserSection');
    const welcomeUserSpan = document.getElementById('welcomeUser');

    // Helper to render pilot options
    function renderPilotGrid(containerId, plans, category) {
        const container = document.getElementById(containerId);
        container.innerHTML = '';
        plans.forEach((plan, idx) => {
            const div = document.createElement('div');
            div.className = 'pilot-option';
            div.dataset.category = category;
            div.dataset.label = plan.label;
            div.dataset.price = plan.price;
            div.innerHTML = `<span>${plan.label}</span><span class="price-badge">${plan.price}</span>`;
            div.addEventListener('click', () => {
                document.querySelectorAll('.pilot-option').forEach(opt => opt.classList.remove('selected'));
                div.classList.add('selected');
                selectedPilot = {
                    category: category,
                    label: plan.label,
                    price: plan.price,
                    user: currentUser?.username || 'unknown',
                };
            });
            container.appendChild(div);
        });
    }

    function updateLanguageUI() {
        const lang = translations[currentLang];
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.lang === currentLang);
        });
        if (!document.getElementById('mainScreen').classList.contains('hidden')) {
            welcomeUserSpan.textContent = currentUser?.name || 'Pilot';
        }
        // adjust titles
        if (newMemberSection && oldUserSection) {
            document.querySelector('#newMemberSection h3')!.textContent = lang.newMemberTitle;
            document.querySelector('#oldUserSection .card:nth-child(1) h3')!.textContent = lang.breakTitle;
            document.querySelector('#oldUserSection .card:nth-child(2) h3')!.textContent = lang.nobreakTitle;
        }
        const agreeText = document.querySelector('.agree-row span');
        if (agreeText) agreeText.textContent = `✅/❎ | [ ] ${lang.agreeText}`;
        const confirmBtn = document.getElementById('confirmPilotBtn');
        if (confirmBtn) confirmBtn.textContent = lang.confirmBtn;
        const inboxTitle = document.querySelector('#inboxScreen h3');
        if (inboxTitle) inboxTitle.textContent = lang.inboxTitle;
    }

    // Supabase table name (assumed 'pilot_messages' and 'profiles')
    async function savePilotMessage(messageData) {
        try {
            const { data, error } = await supabase.from('pilot_messages').insert([messageData]);
            if (error) console.error('Supabase insert error', error);
            else console.log('Message saved', data);
        } catch (e) { console.warn(e); }
    }

    async function fetchInbox() {
        try {
            const { data, error } = await supabase.from('pilot_messages').select('*').order('created_at', { ascending: false });
            if (error) return [];
            return data || [];
        } catch { return []; }
    }

    // login / signup
    document.getElementById('loginBtn').addEventListener('click', async () => {
        const name = document.getElementById('loginName').value.trim();
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value.trim();
        if (!name || !username || !password) { alert('Please fill all fields'); return; }

        // check existing user (mock)
        const { data: existingUser, error } = await supabase.from('users').select('*').eq('username', username).maybeSingle();
        let user;
        if (existingUser) {
            user = existingUser;
        } else {
            const createdAt = new Date().toISOString();
            const { data: newUser, error: insertErr } = await supabase.from('users').insert([{ name, username, password, created_at: createdAt }]).select().single();
            if (insertErr) { alert('Error creating user'); return; }
            user = newUser;
        }
        currentUser = user;
        // determine if new (less than 24h old)
        const isNew = (Date.now() - new Date(user.created_at).getTime()) < 86400000; 
        showMainScreen(isNew);
        updateLanguageUI();
    });

    function showMainScreen(isNew) {
        signinScreen.classList.add('hidden');
        inboxScreen.classList.add('hidden');
        settingsScreen.classList.add('hidden');
        mainScreen.classList.remove('hidden');
        welcomeUserSpan.textContent = currentUser?.name || '';
        newMemberSection.classList.toggle('hidden', !isNew);
        oldUserSection.classList.toggle('hidden', isNew);
        // reset selection
        selectedPilot = null;
        agreeStatus = null;
        document.querySelectorAll('.pilot-option').forEach(o => o.classList.remove('selected'));
        document.getElementById('agreeCheckbox').checked = false;
        document.querySelector('.check-btn').classList.remove('selected');
        document.querySelector('.cross-btn').classList.remove('selected');
        updateLanguageUI();
    }

    // navigation
    document.getElementById('inboxBtn').addEventListener('click', async () => {
        signinScreen.classList.add('hidden');
        mainScreen.classList.add('hidden');
        settingsScreen.classList.add('hidden');
        inboxScreen.classList.remove('hidden');
        const messages = await fetchInbox();
        const container = document.getElementById('inboxMessages');
        container.innerHTML = messages.map(msg => `
            <div class="message-bubble">
                <strong>${msg.username || 'unknown'}</strong> <span class="small-text">(${msg.pilot_selected || ''})</span>
                <p>${msg.message || ''}</p>
                <span class="small-text">${new Date(msg.created_at).toLocaleString()}</span>
            </div>`).join('');
    });

    document.getElementById('settingsBtn').addEventListener('click', () => {
        signinScreen.classList.add('hidden');
        mainScreen.classList.add('hidden');
        inboxScreen.classList.add('hidden');
        settingsScreen.classList.remove('hidden');
        // load profile if available
        if (currentUser) {
            document.getElementById('profileName').value = currentUser.name || '';
            document.getElementById('profileUsername').value = currentUser.username || '';
            // payment fields from localstorage or supabase (simple)
        }
    });

    document.getElementById('backFromInbox').addEventListener('click', () => {
        inboxScreen.classList.add('hidden');
        mainScreen.classList.remove('hidden');
    });
    document.getElementById('backFromSettings').addEventListener('click', () => {
        settingsScreen.classList.add('hidden');
        mainScreen.classList.remove('hidden');
    });

    // language switching
    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            currentLang = btn.dataset.lang;
            updateLanguageUI();
        });
    });

    // agree buttons
    document.getElementById('agreeYes').addEventListener('click', () => {
        agreeStatus = 'yes';
        document.querySelector('.check-btn').classList.add('selected');
        document.querySelector('.cross-btn').classList.remove('selected');
        document.getElementById('agreeCheckbox').checked = true;
    });
    document.getElementById('agreeNo').addEventListener('click', () => {
        agreeStatus = 'no';
        document.querySelector('.cross-btn').classList.add('selected');
        document.querySelector('.check-btn').classList.remove('selected');
        document.getElementById('agreeCheckbox').checked = false;
    });

    // confirm pilot
    document.getElementById('confirmPilotBtn').addEventListener('click', async () => {
        if (!selectedPilot) { alert('Please select a pilot set-up'); return; }
        if (agreeStatus !== 'yes') { alert('You must agree (✅) first'); return; }
        const checkbox = document.getElementById('agreeCheckbox');
        if (!checkbox.checked) { alert('Check the agreement box'); return; }

        const messageData = {
            username: currentUser?.username || 'anonymous',
            password: '••••••', // never send real password
            pilot_selected: `${selectedPilot.label} - ${selectedPilot.price} (${selectedPilot.category})`,
            message: `Pilot selected: ${selectedPilot.label} ${selectedPilot.price}`,
            owner_email: 'xdrgxdragon@gmail.com',
            created_at: new Date().toISOString(),
        };
        await savePilotMessage(messageData);
        // automation message for user
        const autoMsg = {
            username: 'Xdrg System',
            message: 'Your Pilot System Has End To Renew the pilot just Select at Pilot Selection Date & Time',
            created_at: new Date().toISOString(),
        };
        await savePilotMessage(autoMsg);
        alert('✅ Pilot sent to owner! Check inbox.');
        // show inbox maybe
    });

    // save profile
    document.getElementById('saveProfileBtn').addEventListener('click', async () => {
        const profileData = {
            name: document.getElementById('profileName').value,
            username: document.getElementById('profileUsername').value,
            payment_name: document.getElementById('paymentName').value,
            payment_number: document.getElementById('paymentNumber').value,
            pilot_username: document.getElementById('pilotUsername').value,
            pilot_password: document.getElementById('pilotPassword').value,
        };
        if (currentUser) {
            const { error } = await supabase.from('users').update(profileData).eq('username', currentUser.username);
            if (!error) alert('Profile saved!');
            else alert('Error saving');
        } else {
            alert('Login first');
        }
    });

    // initial render pilot grids
    renderPilotGrid('newPilotGrid', newMemberPlans, 'new');
    renderPilotGrid('breakPilotGrid', breakPlans, 'break');
    renderPilotGrid('nobreakPilotGrid', noBreakPlans, 'nobreak');

    // Auto show signin initially
    window.addEventListener('load', () => {
        signinScreen.classList.remove('hidden');
        mainScreen.classList.add('hidden');
        inboxScreen.classList.add('hidden');
        settingsScreen.classList.add('hidden');
        updateLanguageUI();
    });
